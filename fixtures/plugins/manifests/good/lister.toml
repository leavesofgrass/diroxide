[plugin]
id = "line-counter"
name = "Line counter"
version = "0.1.0"
protocol = 1

[run]
command = ["python3", "main.py"]

[[command]]
id = "changed"
name = "Show changed files"

[[command]]
id = "show_diff"
name = "Show the diff of a row"

[[lister]]
id = "changes"
name = "Changed files"
activate = "show_diff"

[[lister.columns]]
id = "state"
header = "State"
kind = "text"
sorts = true

[[lister.columns]]
id = "size"
header = "Size"
kind = "size"

[[lister.action]]
key = "ctrl+d"
command = "show_diff"
selection = "one"
