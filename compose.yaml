# The diroxide development container. One target volume per agent, named
# by DIRO_AGENT, so containers never share a build lock; the cargo registry
# and git caches are shared. Nothing outside the repository is mounted.
#
#   MSYS_NO_PATHCONV=1 docker compose build dev
#   MSYS_NO_PATHCONV=1 DIRO_AGENT=w1a docker compose run --rm dev scripts/dev-check.sh
#
# Defaults: 6 GB of memory, 4 CPUs and 4 cargo jobs per container; at most
# three containers build at once on the owner's machine. See
# docs/dev/docker.md.

name: diroxide

services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      # The Dockerfile's first stage; the GUI stage after it is the gui
      # service's.
      target: dev
    image: diroxide-dev
    working_dir: /work
    volumes:
      - .:/work
      - target:/target
      - cargo-registry:/home/builder/.cargo/registry
      - cargo-git:/home/builder/.cargo/git
    environment:
      CARGO_TARGET_DIR: /target
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: ${DIRO_JOBS:-4}
      CARGO_TERM_COLOR: never
      # The checkout is mounted from the host under another owner; git
      # refuses it as dubious until it is named safe (the xtask's
      # components list reads `git ls-files`).
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /work
    mem_limit: ${DIRO_MEM:-6g}
    cpus: ${DIRO_CPUS:-4}

  # The GUI's accessibility checks on Linux (G1; the owner's answer 107):
  # the dev image's GUI stage, with Xvfb, the AT-SPI bus, Mesa's software
  # Vulkan, pyatspi and accessibility-cli. Same mounts and limits as dev.
  #
  #   MSYS_NO_PATHCONV=1 docker compose build gui
  #   MSYS_NO_PATHCONV=1 DIRO_AGENT=g1 docker compose run --rm gui bash tools/a11y/atspi-check.sh
  gui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: gui
    image: diroxide-gui
    working_dir: /work
    volumes:
      - .:/work
      - target:/target
      - cargo-registry:/home/builder/.cargo/registry
      - cargo-git:/home/builder/.cargo/git
    environment:
      CARGO_TARGET_DIR: /target
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: ${DIRO_JOBS:-4}
      CARGO_TERM_COLOR: never
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /work
    mem_limit: ${DIRO_MEM:-6g}
    cpus: ${DIRO_CPUS:-4}

  # The helper programs of alpha 4 (P4; the owner's answer 118): the dev
  # image's tools stage, with Tesseract, ExifTool, GnuPG, age, minisign,
  # the file-system makers for the disk-image fixtures and qemu-img, beside
  # the dev stage's ImageMagick, FFmpeg, pandoc and poppler. Same mounts
  # and limits as dev.
  #
  #   MSYS_NO_PATHCONV=1 docker compose build tools
  #   MSYS_NO_PATHCONV=1 DIRO_AGENT=p4 docker compose run --rm tools scripts/dev-check.sh
  tools:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: tools
    image: diroxide-tools
    working_dir: /work
    volumes:
      - .:/work
      - target:/target
      - cargo-registry:/home/builder/.cargo/registry
      - cargo-git:/home/builder/.cargo/git
    environment:
      CARGO_TARGET_DIR: /target
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: ${DIRO_JOBS:-4}
      CARGO_TERM_COLOR: never
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /work
    mem_limit: ${DIRO_MEM:-6g}
    cpus: ${DIRO_CPUS:-4}

volumes:
  target:
    name: diro-target-${DIRO_AGENT:-orch}
  cargo-registry:
    name: diro-cargo-registry
  cargo-git:
    name: diro-cargo-git
