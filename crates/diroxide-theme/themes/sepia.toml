# Sepia: Warm paper tones for long reading.
#
# Ported from star's `sepia` palette (star/themes.py).
# Error color: star's terminal error color (xterm 124, #af0000).
# star's colors, unchanged. Meets WCAG AA.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "sepia"
display_name = "Sepia"
kind = "light"
description = "Warm paper tones for long reading."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"

[colors]
background = "#f4ecd8"
surface = "#eadfc6"
text = "#3d2f1f"
dim_text = "#6d5c42"
heading1 = "#8a4510"
heading2 = "#6b4a20"
heading3 = "#4f5d2f"
heading4 = "#175e63"
heading5 = "#175e63"
heading6 = "#175e63"
link = "#14607a"
code = "#7a3b12"
code_background = "#eadfc6"
quote = "#6d5c42"
error = "#af0000"

[styles.selection]
foreground = "#3d2f1f"
background = "#e0d2b4"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#f4ecd8"
background = "#8a4510"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#3d2f1f"
background = "#e0d2b4"
attributes = ["underline"]

[styles.find_hit]
foreground = "#f4ecd8"
background = "#4f5d2f"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#f4ecd8"
background = "#6b4a20"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#175e63"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#7a3b12"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#f4ecd8"
background = "#8a4510"
attributes = ["bold"]

[styles.focus]
foreground = "#f4ecd8"
background = "#14607a"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#3d2f1f"
background = "#f8e490"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#3d2f1f"
background = "#b1dfac"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#3d2f1f"
background = "#a2c8e6"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#3d2f1f"
background = "#f8bbc5"
attributes = ["bold"]
