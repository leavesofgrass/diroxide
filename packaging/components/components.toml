# ExifTool 13.61 for Windows, where exiftool.org links (SourceForge, which
# keeps old versions; exiftool.org keeps only the newest), compared with
# exiftool.org's checksums file. Spike T1: two members are not plain;
# rename takes exiftool(-k).exe to exiftool.exe, but perl532.dll loads
# exiftool_files/libstdc++-6.dll by that name, whose plus sign the
# plain-name rule refuses. Held until the owner decides.
[[component]]
id = "exiftool"
title = "ExifTool"
kind = "helper"
version = "13.61"
license = "Artistic-1.0-Perl OR GPL-1.0-or-later"
credit = "Phil Harvey"
features = ["metadata"]
tools = ["exiftool"]
action = "unpack"
held = "perl532.dll needs libstdc++-6.dll, not a plain name; the owner decides"

[[component.file]]
name = "exiftool-13.61_64.zip"
target = "x86_64-pc-windows-msvc"
url = "https://sourceforge.net/projects/exiftool/files/exiftool-13.61_64.zip/download"
checksums = "https://exiftool.org/checksums-13.61.txt"
strip = 1
keep = ["exiftool*.exe", "exiftool_files/**"]
rename = [["exiftool(-k).exe", "exiftool.exe"]]
exec = "exiftool.exe"

