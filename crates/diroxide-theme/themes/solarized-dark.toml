# Solarized Dark: Solarized dark, nudged for contrast.
#
# Ported from star's `solarized-dark` palette (star/themes.py).
# Error color: star's terminal error color (xterm 160, #d70000).
# star's colors, unchanged. Does not meet WCAG AA: 1 of 61 contrast checks fall short.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "solarized-dark"
display_name = "Solarized Dark"
kind = "dark"
description = "Solarized dark, nudged for contrast."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"
counterpart = "solarized-light"

[colors]
background = "#002b36"
surface = "#073642"
text = "#93a1a1"
dim_text = "#82989f"
heading1 = "#4aa2df"
heading2 = "#2aa198"
heading3 = "#859900"
heading4 = "#b58900"
heading5 = "#b58900"
heading6 = "#b58900"
link = "#4aa2df"
code = "#f0784a"
code_background = "#073642"
quote = "#82989f"
error = "#d70000"

[styles.selection]
foreground = "#93a1a1"
background = "#073642"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#002b36"
background = "#4aa2df"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#93a1a1"
background = "#073642"
attributes = ["underline"]

[styles.find_hit]
foreground = "#002b36"
background = "#859900"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#002b36"
background = "#2aa198"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#b58900"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#f0784a"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#002b36"
background = "#4aa2df"
attributes = ["bold"]

[styles.focus]
foreground = "#002b36"
background = "#4aa2df"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#93a1a1"
background = "#2c3b02"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#93a1a1"
background = "#003f28"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#93a1a1"
background = "#003762"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#93a1a1"
background = "#412f4a"
attributes = ["bold"]
