# The key-delivery matrix: what each terminal does with the keys the
# presets and the defaults use (research/alpha3-plan.md, the key capture
# spike). It sits beside terminal-unsafe.toml and feeds it: every key a
# terminal here keeps or merges with another key is on that table, so the
# keymap's tests fail on a terminal binding of it, and the Keys list says
# "check terminal" on its row.
#
# One [[key]] per key, in keymap.toml's syntax, with one field per
# terminal:
#   windows_terminal  Windows Terminal on Windows 11, its default settings
#   built_in          the desktop app's built-in terminal
#   tmux              tmux with its default settings, in any outer terminal
#   console_host      the classic Windows console (conhost)
#
# Each value is one of:
#   "delivered"        arrives as itself
#   "kept"             the terminal keeps it; diroxide never sees it
#   "merged with KEY"  arrives as another key, KEY in keymap.toml's syntax
#   "to probe"         not tried yet; the owner's key test fills it in
#
# "source" says where the known values come from; "note" adds what a value
# cannot say. Values marked "to probe" are not guesses: they are the rows
# the owner has not probed. `diro keys test`, or Test keys in the Keys
# list, says what a terminal sent for a key.
#
# Sources: the wiki's dated copy of Microsoft's Windows Terminal actions
# page (October 10, 2026), as plan section 5.7 ("What the terminal
# programs keep") cites it; the owner's first try of alpha.1 in the
# desktop app's built-in terminal (Friday, October 16, 2026: Alt+F and
# Ctrl+Q never arrive); research/accessibility-stack.md section 4 (R4,
# crossterm read from its source: in a terminal that sends escape
# sequences, Ctrl+I is the same byte as Tab, Ctrl+M as Enter and Ctrl+[ as
# Escape) and its note that tmux keeps Ctrl+B as its prefix.

