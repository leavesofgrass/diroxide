# Line counter: an example diroxide plugin in Python, standard library
# only. It counts the lines of the selected files and says the total.
# `diro plugin new NAME --language python` writes a copy of this folder
# under a new name.

[plugin]
id = "line-counter"
name = "Line counter"
version = "0.1.0"
description = "Counts the lines of the selected files and says the total."
license = "Apache-2.0 OR MIT"
protocol = 1
min_host = "0.1.0-alpha.1"

# How diroxide starts it: an argument list, never a shell line. On Windows
# the py launcher, so the Store's python stub is never involved.
[run]
command = ["python3", "main.py"]
start = "on_demand"
concurrency = 1
idle_timeout = "5m"

[run.windows]
command = ["py", "-3", "main.py"]

# What diroxide lets it do, and checks: read the files it is given.
[permissions]
fs = "read"
panel = "none"

# What it says about itself, which diroxide shows and cannot check.
[permissions.declared]
network = "no network"
files = "only the files it is given"
programs = "no other programs"

[[command]]
id = "count_lines"
name = "Count lines"
description = "Says how many lines the selected files hold."
selection = "any"
places = "local"

[[setting]]
key = "skip_blank"
type = "bool"
default = false
description = "Leave blank lines out of the count."
