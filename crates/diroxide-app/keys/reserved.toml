# Keys kept free now for the commands of later alphas (plan section 5.7
# and the Wave 1 amendments), so no alpha.1 binding takes a key the plan
# has already promised. The keymap's tests read it: a default binding
# uses a reserved key only for the command it is reserved for.
#
# column = "both", "terminal" or "gui".


[[key]]
keys = ["ctrl+shift+e"]
command = "view.tree"
name = "Folder tree"
alpha = "alpha.8"
column = "gui"

# F11 was kept here for Full screen until the command came (lane A6): the
# GUI column binds it to view.full-screen now.
