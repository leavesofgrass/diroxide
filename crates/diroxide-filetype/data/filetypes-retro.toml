# The retro pack: the old formats, Amiga and tracker music, PowerPacker,
# the IFF family, old office files and the like. Embedded, and read only
# while the setting filetypes.retro is on. Same shape as filetypes.toml.

[[type]]
id = "mod"
name = "ProTracker module"
short = "MOD"
mime = "audio/x-mod"
group = "music"
extensions = ["mod"]
retro = true

[[type]]
id = "s3m"
name = "Scream Tracker module"
short = "S3M"
mime = "audio/x-s3m"
group = "music"
extensions = ["s3m"]
magic = [
    { at = 44, hex = "53 43 52 4D" }, # SCRM
]
retro = true

[[type]]
id = "xm"
name = "FastTracker module"
short = "XM"
mime = "audio/x-xm"
group = "music"
extensions = ["xm"]
magic = [
    { at = 0, hex = "45 78 74 65 6E 64 65 64 20 4D 6F 64 75 6C 65 3A 20" }, # Extended Module: 
]
retro = true

[[type]]
id = "it"
name = "Impulse Tracker module"
short = "IT"
mime = "audio/x-it"
group = "music"
extensions = ["it"]
magic = [
    { at = 0, hex = "49 4D 50 4D" }, # IMPM
]
retro = true

[[type]]
id = "med"
name = "OctaMED module"
short = "MED"
mime = "audio/x-med"
group = "music"
extensions = ["med", "mmd0", "mmd1", "mmd2", "mmd3"]
magic = [
    { at = 0, hex = "4D 4D 44" }, # MMD
]
retro = true

[[type]]
id = "mtm"
