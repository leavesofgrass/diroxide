# One Dark: The One Dark editor palette.
#
# Ported from star's `one-dark` palette (star/themes.py).
# Error color: the scheme's red (#e06c75); star had no error color.
# star's colors, unchanged. Does not meet WCAG AA: 2 of 61 contrast checks fall short.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "one-dark"
display_name = "One Dark"
kind = "dark"
description = "The One Dark editor palette."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"
counterpart = "one-light"

[colors]
background = "#282c34"
surface = "#21252b"
text = "#abb2bf"
dim_text = "#5c6370"
heading1 = "#61afef"
heading2 = "#c678dd"
heading3 = "#56b6c2"
heading4 = "#98c379"
heading5 = "#98c379"
heading6 = "#98c379"
link = "#61afef"
code = "#e5c07b"
code_background = "#21252b"
quote = "#8b93a1"
error = "#e06c75"

[styles.selection]
foreground = "#abb2bf"
background = "#3e4451"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#282c34"
background = "#61afef"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#abb2bf"
background = "#3e4451"
attributes = ["underline"]

[styles.find_hit]
foreground = "#282c34"
background = "#56b6c2"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#282c34"
background = "#c678dd"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#98c379"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#e5c07b"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#282c34"
background = "#61afef"
attributes = ["bold"]

[styles.focus]
foreground = "#282c34"
background = "#61afef"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#abb2bf"
background = "#4f4508"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#abb2bf"
background = "#1e4d32"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#abb2bf"
background = "#1f4671"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#abb2bf"
background = "#643650"
attributes = ["bold"]
