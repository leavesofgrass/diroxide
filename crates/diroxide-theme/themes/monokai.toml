# Monokai: The Monokai palette.
#
# Ported from star's `monokai` palette (star/themes.py).
# Error color: star's terminal error color (xterm 197, #ff005f).
# star's colors, unchanged. Does not meet WCAG AA: 1 of 61 contrast checks fall short.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "monokai"
display_name = "Monokai"
kind = "dark"
description = "The Monokai palette."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"

[colors]
background = "#272822"
surface = "#1e1f1c"
text = "#f8f8f2"
dim_text = "#a59f85"
heading1 = "#66d9ef"
heading2 = "#a6e22e"
heading3 = "#fd971f"
heading4 = "#ae81ff"
heading5 = "#ae81ff"
heading6 = "#ae81ff"
link = "#66d9ef"
code = "#e6db74"
code_background = "#1e1f1c"
quote = "#a59f85"
error = "#ff005f"

[styles.selection]
foreground = "#f8f8f2"
background = "#49483e"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#272822"
background = "#66d9ef"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#f8f8f2"
background = "#49483e"
attributes = ["underline"]

[styles.find_hit]
foreground = "#272822"
background = "#fd971f"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#272822"
background = "#a6e22e"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#ae81ff"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#e6db74"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#272822"
background = "#66d9ef"
attributes = ["bold"]

[styles.focus]
foreground = "#272822"
background = "#66d9ef"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#f8f8f2"
background = "#685c1b"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#f8f8f2"
background = "#2b5833"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#f8f8f2"
background = "#1e4464"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#f8f8f2"
background = "#683948"
attributes = ["bold"]
