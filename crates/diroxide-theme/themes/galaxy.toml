# Galaxy: Purple-accented dark theme; the default.
#
# Ported from star's `galaxy` palette (star/themes.py).
# Error color: the scheme's red (#ff7b93); star had no error color.
# Changed to meet the contrast floor (smallest lightness change that passes):
#   colors.dim_text: #7d7d7d -> #858585 (4.0 to 1 -> 4.5 to 1 against #1e1e1e, needs 4.5 to 1)
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "galaxy"
display_name = "Galaxy"
kind = "dark"
description = "Purple-accented dark theme; the default."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"
counterpart = "galaxy-light"

[colors]
background = "#1e1e1e"
surface = "#2a2a2a"
text = "#dadada"
dim_text = "#858585"
heading1 = "#c9b6ff"
heading2 = "#a98eff"
heading3 = "#8aa2ff"
heading4 = "#7bd0c1"
heading5 = "#7bd0c1"
heading6 = "#7bd0c1"
link = "#a882ff"
code = "#e0a87a"
code_background = "#2a2a2a"
quote = "#858585"
error = "#ff7b93"

[styles.selection]
foreground = "#dadada"
background = "#483d6b"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#1e1e1e"
background = "#c9b6ff"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#dadada"
background = "#483d6b"
attributes = ["underline"]

[styles.find_hit]
foreground = "#1e1e1e"
background = "#8aa2ff"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#1e1e1e"
background = "#a98eff"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#7bd0c1"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#e0a87a"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#1e1e1e"
background = "#c9b6ff"
attributes = ["bold"]

[styles.focus]
foreground = "#1e1e1e"
background = "#a882ff"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#dadada"
background = "#625518"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#dadada"
background = "#255130"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#dadada"
background = "#183d62"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#dadada"
background = "#623246"
attributes = ["bold"]
