[package]
name = "diroxide-app"
description = "The app core of diroxide: two panels, commands, keymap dispatch, menus, the palette, dialogs, jobs and announcements."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
# Archives: the provider made from the [archives] settings, and the pack,
# unpack and test runners the dialogs start (W2f).
diroxide-archive.workspace = true
diroxide-config.workspace = true
diroxide-core.workspace = true
diroxide-filetype.workspace = true
diroxide-ops.workspace = true
# The viewer's decoder and highlighter (W2d).
diroxide-preview.workspace = true
diroxide-theme.workspace = true
# The quick view's "Open in textweaver" finds `tw` through the tools
# registry (W2e).
diroxide-tools.workspace = true
diroxide-vfs.workspace = true
dirs.workspace = true
jiff.workspace = true
opener.workspace = true
# The viewer's search (W2d).
regex.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
# The app's own tests read code through the highlighter.
diroxide-preview = { workspace = true, features = ["syntax-set"] }
tempfile.workspace = true

[features]
# The viewer's syntax set (W2d's request 2, P2b): the preview crate's
# syntect grammars, forwarded from `diro`'s default through the CLI. Off
# here, so the CLI's dependency on the app can leave it out; without it the
# viewer says "Highlighting off: not in this build".
syntax-set = ["diroxide-preview/syntax-set"]

[lints]
workspace = true
