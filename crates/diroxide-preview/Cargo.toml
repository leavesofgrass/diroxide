[package]
name = "diroxide-preview"
description = "Previews for diroxide, text first: details in words, text, hex, and what the tools can say."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
# The quick view's readers (W2e): carta for Org, reStructuredText,
# MediaWiki, DokuWiki and Jira, pulldown-cmark for Markdown.
carta.workspace = true
diroxide-core.workspace = true
diroxide-filetype.workspace = true
diroxide-vfs.workspace = true
# The viewer's decoder (W2d), textweaver's encoding module.
encoding_rs.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
# The highlight module (W2d): syntect as a tokenizer, bat's grammars,
# behind the default syntax-set feature.
syntect = { workspace = true, optional = true }
thiserror.workspace = true
two-face = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true
serde_json.workspace = true

[features]
default = ["syntax-set"]
# The syntax set (W2d): syntect with bat's grammars from two-face. Without
# it the highlighter says "Highlighting off: not in this build" and the
# viewer's words-first commands keep what needs no grammar.
syntax-set = ["dep:syntect", "dep:two-face"]

[lints]
workspace = true
