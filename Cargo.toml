[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Plugins live in workspaces of their own (plan section 5.8, item 3): the
# main workspace, and so `cargo install diro`, never sees what they build.
# The vendored GUI stack is two workspaces of its own (docs/dev/vendoring.md):
# its crates are depended on by path below, and patched in for crates.io's
# parley and accesskit_windows at the end of this file, as textweaver's
# root manifest does.
exclude = ["plugins", "third_party/xilem", "third_party/accesskit_windows"]

[workspace.package]
version = "0.1.0-alpha.4"
edition = "2024"
license = "Apache-2.0 OR MIT"
homepage = "https://diroxide.app"
repository = "https://github.com/leavesofgrass/diroxide"
# Nothing is published until the owner says so.
publish = false

# Every dependency is declared once, here. Member crates take what they need
# with `name.workspace = true`; `cargo xtask deps --check` enforces both that
# and the direction of the internal dependencies (docs/dev/architecture.md).
#
# The pure-Rust goal (plan section 4, principle 5; answer 46: a goal, not
# a rule): a crate that brings a C, C++ or assembly build into the main
# workspace enters only through the inventory in `xtask/src/native.rs`,
# with its reason, in the same commit. `cargo xtask native --check` fails
# on any other `cc`, `cmake` or `cxx` build dependency in the build tree.
# The inventory: `ring` (through `rustls` through `ureq`), the
# downloader's TLS provider behind the `fetch` feature of `diro` (the
# owner's exception, Sunday, October 11, 2026); `psm` and `stacker`
# (through `carta`), the converter's stack growth (alpha.2's contract
# step, Friday, October 16, 2026); `wayland-backend` (through winit) and
# `android-activity` (Android only), both under the GUI's window runner
# (the GUI alpha's contract step, Monday, November 2, 2026); `blake3`
# (through diroxide-meta, build-only with `pure`, answer 45) and
# `pkg-config`, counted as a native tool since alpha 4's contract step
# (Thursday, November 5, 2026), for five crates under the GUI that load
# their library at run time.
[workspace.dependencies]
# The workspace's own crates.
diroxide-core = { path = "crates/diroxide-core", version = "0.1.0-alpha.4" }
diroxide-vfs = { path = "crates/diroxide-vfs", version = "0.1.0-alpha.4" }
diroxide-archive = { path = "crates/diroxide-archive", version = "0.1.0-alpha.4" }
diroxide-ops = { path = "crates/diroxide-ops", version = "0.1.0-alpha.4" }
diroxide-search = { path = "crates/diroxide-search", version = "0.1.0-alpha.4" }
diroxide-diff = { path = "crates/diroxide-diff", version = "0.1.0-alpha.4" }
diroxide-filetype = { path = "crates/diroxide-filetype", version = "0.1.0-alpha.4" }
# Metadata: fields by cost class, checksums and the strip (alpha 4's
# contract step).
diroxide-meta = { path = "crates/diroxide-meta", version = "0.1.0-alpha.4" }
diroxide-config = { path = "crates/diroxide-config", version = "0.1.0-alpha.4" }
diroxide-plugins = { path = "crates/diroxide-plugins", version = "0.1.0-alpha.4" }
diroxide-tools = { path = "crates/diroxide-tools", version = "0.1.0-alpha.4" }
# Without its default syntax set, which each member that wants it turns on
# through its own `syntax-set` feature: the app, the CLI, and `diro`, whose
# default has it (W2d's request 2, P2b), so a slim `diro` can leave it out.
diroxide-preview = { path = "crates/diroxide-preview", version = "0.1.0-alpha.4", default-features = false }
diroxide-theme = { path = "crates/diroxide-theme", version = "0.1.0-alpha.4" }
diroxide-app = { path = "crates/diroxide-app", version = "0.1.0-alpha.4" }
diroxide-tui = { path = "crates/diroxide-tui", version = "0.1.0-alpha.4" }
diroxide-gui = { path = "crates/diroxide-gui", version = "0.1.0-alpha.4" }
diroxide-cli = { path = "crates/diroxide-cli", version = "0.1.0-alpha.4" }
# Optional components: pins, the embedded list, the downloader (W4c).
diroxide-components = { path = "crates/diroxide-components", version = "0.1.0-alpha.4" }

# Used by the contract (Phase 0 and the Wave 1 amendments).
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"
thiserror = "2.0.18"
toml = "1.1.6"
# The pattern module of diroxide-core (globs and `re:` patterns).
regex = "1.13.1"
# Secrets: a wrapper that zeroizes and redacts (research/encryption.md).
secrecy = "0.10.3"
zeroize = "1.8.1"

# Declared for the waves to come (plan section 6), not yet depended on, so
# the first build stays small. Versions are textweaver's where it uses the
# crate, so the two projects share a cache.
#
# Search: ripgrep's crates (MIT or Unlicense). The `ignore` and
# `grep-searcher` pins were checked on Friday, October 16, 2026.
ignore = "0.4.33"
globset = "0.4.18"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
# Archives (research/archives.md section 15 F; plan question 6 closed by
# answer 26). zip 9.0.1 exactly, as decided (9.0.4 exists, but it moved
# to lzma-rust2 0.22; a bump is the orchestrator's, with sevenz-rust2).
# lzma-rust2 on the 0.21 line that zip 9.0.1 and sevenz-rust2 0.23 share,
# so one copy is compiled (`cargo tree -d` shows one); `optimization` on
# (owner question 5's default, hand-written `unsafe` inside the crate).
# liblzma has left the main workspace under the plugin boundary; there is
# no `xz-c` feature. Since the alpha.2 contract step (P2) the archive
# crate depends on these, so the license and native gates read them.
zip = { version = "=9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "aes-crypto", "lzma", "xz", "ppmd", "deflate64"] }
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "encoder", "xz", "optimization"] }
sevenz-rust2 = { version = "=0.23.0", default-features = false, features = ["compress", "aes256", "bzip2", "ppmd", "util"] }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1.5", default-features = false, features = ["zlib-rs"] }
# bzip2 0.6 reads and writes through libbz2-rs-sys, a Rust port (no C).
bzip2 = "0.6.1"
# CRC-32 for the split sidecar (`.crc`, plan section 5.4) and the archive
# checks; already in the graph through zip, declared for the ops crate.
crc32fast = "1.5.2"
# The local provider's `sys` module (research/file-operations.md C6):
# safe Unix wrappers, the Windows calls, and copy-on-write clones.
rustix = { version = "1.1.6", features = ["fs", "process"] }
# Alpha 4's contract step (P4) adds the features of the calls its lanes
# make, names read in windows-sys 0.61.2's own modules: alternate data
# streams (FindFirstStreamW and FindNextStreamW, in Storage_FileSystem,
# already here), the registry reads of Open with (RegOpenKeyExW,
# RegQueryValueExW, RegEnumKeyExW: System_Registry), the security
# descriptor, the access list's words and the Authz check
# (GetNamedSecurityInfoW, ConvertSidToStringSidW, AuthzInitializeContextFromSid,
# AuthzAccessCheck: Security_Authorization; LookupAccountSidW, GetAce:
# Security), and the hand-offs to the system's own dialogs (the Security
# tab and Open with: SHObjectProperties and ShellExecuteExW, UI_Shell).
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Registry", "Win32_UI_Shell"] }
reflink-copy = "0.1.30"
# Watching, trash, volumes, folders, hashing. trash 5.2.9 is the version
# spikes four and six measured; it is used only behind the trash gate
# (plan section 5.12). Keep sysinfo on its default features.
notify = "8.2.0"
# Without its default chrono feature, which reaches a C build dependency
# through a Haiku-only time-zone crate (W1a's contract request 1).
trash = { version = "=5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
sysinfo = "0.36.1"
dirs = "6.0.0"
# blake3 always declares `cc` (a non-optional build dependency), even with
# `pure`, which compiles no C. The pure-Rust inventory allows it through
# diroxide-meta only (the owner's answer 45). No other crate may depend on
# it: the duplicate finder takes its hasher from the caller, who fills it
# from the meta crate's checksum. Widening the allowance is the owner's call.
blake3 = { version = "1.8.2", features = ["pure"] }
# Pins for the components downloader and checksums. Held at 0.10 by alpha
# 4's contract step (R28's disagreement 15): 0.11's digest traits drop
# std::io::Write from the hashers (the digest-io crate wraps them now),
# and the job engine's parts test copies a reader into a hasher, so the
# move waits for that one test's change (a contract request). md-5 below
# stays on the same digest family.
sha2 = "0.10.9"
# Comment-preserving writes of the owner's TOML files (plan section 5.11).
toml_edit = "0.25.15"
# Opening a file with the system's program, never through a shell; opener,
# not open, which starts PowerShell for every open (spike four).
opener = "0.8.5"
# Process trees: job objects on Windows, process groups elsewhere
# (research/alpha4-plan.md). No async runtime in the main binary.
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "creation-flags", "job-object", "kill-on-drop", "process-group", "process-session"] }
# The downloader's HTTP client, the owner's one exception to the pure-Rust
# rule (answer 40): textweaver's pin, rustls with the ring provider,
# behind the default `fetch` feature of `diro` only.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# Compare (alpha.3, research/diffing.md): std, text and inline only.
similar = { version = "3.2.0", default-features = false, features = ["std", "text", "inline"] }
# Highlighting and documents (alpha.2, research/syntax-highlighting.md and
# research/alpha2-plan.md 4.5 and 4.6), depended on by the preview crate
# since the alpha.2 contract step (P2). syntect as a tokenizer: parsing
# with the fancy-regex engine, never Oniguruma (C), and none of its
# themes, plist, YAML or HTML features; two-face brings bat's grammars.
# Both run at full speed in debug builds (the profile entries below).
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
# Text decoding: textweaver's encoding module carries over whole (answer
# 41); (Apache-2.0 OR MIT) AND BSD-3-Clause, both allowed.
encoding_rs = "0.8.42"
# carta, the pure-Rust converter (answer 27): pinned exactly, default
# features off (no CLI, no `fetch`, no highlight grammars). Its include
# directives are never followed and its Typst reader is never built (it
# reads any file a document names). The writer the quick view uses is
# `write-html`, path A of spike C1 (plan question 66, W2e, Friday,
# October 16, 2026): carta writes an HTML fragment for the quick view's
# fragment reader. 0.0.13 since alpha 4's contract step, by spike C2
# (answer 119): on twelve samples each, its DOCX, EPUB, ODT, CSV and HTML
# readers kept every heading, every table with its header row and every
# list's nesting, so those formats are carta's; its RTF reader never
# keeps a table's header row, so RTF is textweaver's port (commit 40b)
# and `read-rtf` is not built. LaTeX and TSV are carta's by answer 119's
# default (not in C2's samples). The writers are the conversions'
# (AsciiDoc, Typst, LaTeX, MediaWiki, Org, DOCX, EPUB, from Markdown
# read by `read-commonmark`). MIT OR Apache-2.0.
carta = { version = "=0.0.13", default-features = false, features = ["read-org", "read-rst", "read-mediawiki", "read-dokuwiki", "read-jira", "read-docx", "read-epub", "read-odt", "read-csv", "read-tsv", "read-html", "read-latex", "read-commonmark", "write-html", "write-asciidoc", "write-typst", "write-latex", "write-mediawiki", "write-org", "write-docx", "write-epub"] }
# The quick view's HTML-fragment reader for carta's output (path A of
# spike C1), carried from textweaver's html.rs. ISC, allowed.
scraper = "0.27.0"
# Images. `infer` is gone since alpha 4's contract step: the type model's
# data-driven table replaces it (R28 4.4). `ico` joins image's formats for
# the image words (R28 2.2). kamadak-exif reads Exif from JPEG, TIFF,
# HEIF and PNG; checked in the crates.io index, BSD-2-Clause, pure Rust,
# one dependency (alpha 4's contract step).
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
kamadak-exif = "0.6.2"
resvg = "0.47.0"
# Alpha 4: tools, previews and conversions (the contract step, P4, R30
# commit 4; versions and licenses read on Thursday, November 5, 2026).
# Each is pure Rust; `cargo xtask native --check` and `cargo deny check`
# passed with all of them in the tree. Audio tags (MIT OR Apache-2.0).
lofty = "0.25.5"
# Extended attributes on Linux, macOS and the BSDs, for the internet mark
# and the origin row (MIT OR Apache-2.0); the Unix side of the vfs
# extended-attributes trait.
xattr = "1.7.0"
# macOS property lists: Finder tags and the applications' document types
# for Open with (MIT). Declared only: no crate depends on it yet, since
# the preview crate's highlight test refuses any plist in the lock (it
# guards syntect's plist loader); the lane that needs it asks the preview
# crate's owner to narrow that test first.
plist = "1.10.3"
# Strip metadata into a copy: JPEG, PNG and WebP segments (MIT OR
# Apache-2.0).
img-parts = "0.4.2"
# MD5 for old checksum lists, labeled old (MIT OR Apache-2.0); 0.10, the
# digest family sha2 0.10 shares, so the checksum engine has one Digest
# trait (0.11 moves with sha2).
md-5 = "0.10.6"
# PNG text chunks, which image does not expose (MIT OR Apache-2.0).
png = "0.18.1"
# Detached minisign signatures, checked in the main binary (R29 Q12; MIT).
minisign-verify = "=0.3.0"
# Spreadsheets as rows: XLSX, XLS, XLSB and ODS (MIT).
calamine = { version = "0.38.0", default-features = false }
# PDF properties for the details view (answer 120), without its clock and
# its thread pool (MIT).
lopdf = { version = "0.47.0", default-features = false }
# XML for SVG reading and document properties, behind the nesting cut
# textweaver's xmldepth carries (MIT OR Apache-2.0).
roxmltree = "0.21.2"
# The DOS code pages encoding_rs leaves out (437, 850, 866), for the
# encoding chooser, if it passes the gates (R28 4.3; MIT).
oem_cp = "2.1.2"
# macOS access lists, read only, through the system's own library (MIT).
exacl = "0.13.0"
# Terminal and window.
ratatui = "0.30.2"
crossterm = "0.29.0"
# Gives the terminal back on a terminate signal or Ctrl+Break (W1d-2's
# contract request 1); pure Rust.
ctrlc = { version = "3.5.2", features = ["termination"] }
# AccessKit at textweaver's versions, exactly: accesskit_winit 0.34.2 asks
# for accesskit_windows 0.35.2, which would leave the patched 0.35.1 below
# unused and lose its AcceleratorKey change. A move to 0.25.2 (which fixes
# password disclosure, AccessKit 841) is textweaver's refresh first, under
# the sync rule of docs/dev/vendoring.md.
accesskit = "=0.25.1"
# The window's adapter with the features the vendored masonry_winit asks
# for: AT-SPI on the tokio executor, so zbus is compiled once, and no
# second executor (the default async-io would be).
accesskit_winit = { version = "=0.34.1", default-features = false, features = ["accesskit_unix", "tokio", "rwh_06"] }
# The window's clipboard on Wayland (alpha 4, R30 commit 113, on the
# orchestrator's word to lane G5b): the crate the vendored masonry_winit
# already uses, whose Wayland half (smithay-clipboard, libwayland opened at
# run time) is in the tree through it; the GUI opens it on the window's own
# Wayland connection, where the runner opens only the X11 one.
copypasta = "0.10.2"
# The GUI (alpha.3, the GUI alpha; ADR-0007; docs/dev/vendoring.md):
# Masonry, Xilem's widget layer, vendored from textweaver under
# third_party/xilem at upstream revision 271a27a6 (Monday, September 14,
# 2026) with textweaver's patches and diroxide's one, behind the `gui`
# feature of diroxide-gui. Default features off: the GUI crate chooses the
# renderer (Vello) itself. Apache-2.0.
masonry = { path = "third_party/xilem/masonry", default-features = false }
masonry_winit = { path = "third_party/xilem/masonry_winit", default-features = false }
# The headless harness of the GUI's tests: a real AccessKit tree with no
# window, no display and no GPU. diroxide's patch drops its oxipng, the one
# C build on this path (libdeflate). A dev-dependency only.
masonry_testing = { path = "third_party/xilem/masonry_testing" }
# The harness's tests check nodes through AccessKit's own consumer, the
# filter the platform adapters use. Already in the tree through
# masonry_testing; a dev-dependency only.
accesskit_consumer = "=0.39.1"
# Parley's font database, already in the tree through Parley: named so the
# GUI loads Fontconfig at run time on Linux (`fontconfig-dlopen`) instead of
# linking it, so diro starts on a server or in a container without it.
fontique = { version = "0.11.1", default-features = false }
# Command line and logging.
clap = { version = "4.6.1", features = ["derive"] }
# Shell completion scripts for diro completions SHELL (plan section 5.19).
clap_complete = "4.6"
# The local time zone, so dates read in the owner's local time and never in
# UTC (W1e's contract request, resolved at the pair 2 integration): pure Rust,
# with the zone database bundled and the Windows zone read from the system.
jiff = "0.2"
tracing = "0.1.44"
# Tests.
insta = "1.48.0"
proptest = "1.11.0"
tempfile = "3.27.0"

[workspace.lints.rust]
missing_docs = "deny"
# Denied, not forbidden: the platform module of diroxide-vfs may allow it,
# and is reviewed at integration.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# No unwrap or expect in library code; tests may use them (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"

# Build profiles (plan section 7): lean debug builds that share a cache.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 1
debug = false

# The regex engine at full speed in debug builds and tests (R17, R18): a
# pattern compiled at opt-level 1 runs several times slower.
[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

# Highlighting at full speed in debug builds and tests (R17): syntect's
# parser and its fancy-regex engine are the hot loop of the viewer.
[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
lto = false

# Packages for the owner and for releases.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true

# The vendored GUI stack (docs/dev/vendoring.md), as textweaver patches it:
# Parley 0.11.1 with its `accesskit` feature on AccessKit 0.25, which the
# vendored Masonry needs; and AccessKit's Windows adapter 0.35.1 with the
# keyboard shortcut given to UI Automation as AcceleratorKey, so a screen
# reader can say a button's key. No other crate in the workspace uses
# either.
[patch.crates-io]
parley = { path = "third_party/xilem/parley" }
accesskit_windows = { path = "third_party/accesskit_windows" }
