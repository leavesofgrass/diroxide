# Dracula: The Dracula palette.
#
# Ported from star's `dracula` palette (star/themes.py).
# Error color: star's terminal error color (xterm 203, #ff5f5f).
# star's colors, unchanged. Meets WCAG AA.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "dracula"
display_name = "Dracula"
kind = "dark"
description = "The Dracula palette."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"

[colors]
background = "#282a36"
surface = "#21222c"
text = "#f8f8f2"
dim_text = "#9aa0b9"
heading1 = "#bd93f9"
heading2 = "#ff79c6"
heading3 = "#8be9fd"
heading4 = "#50fa7b"
heading5 = "#50fa7b"
heading6 = "#50fa7b"
link = "#8be9fd"
code = "#f1fa8c"
code_background = "#21222c"
quote = "#9aa0b9"
error = "#ff5f5f"

[styles.selection]
foreground = "#f8f8f2"
background = "#44475a"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#282a36"
background = "#bd93f9"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#f8f8f2"
background = "#44475a"
attributes = ["underline"]

[styles.find_hit]
foreground = "#282a36"
background = "#8be9fd"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#282a36"
background = "#ff79c6"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#50fa7b"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#f1fa8c"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#282a36"
background = "#bd93f9"
attributes = ["bold"]

[styles.focus]
foreground = "#282a36"
background = "#8be9fd"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#f8f8f2"
background = "#695e29"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#f8f8f2"
background = "#2c5941"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#f8f8f2"
background = "#1f4572"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#f8f8f2"
background = "#693a56"
attributes = ["bold"]
