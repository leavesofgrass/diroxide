# The optional components this repository builds (plan section 5.14).
#
# cargo xtask components reads this file, packs each file from the
# folders named in its `pack` list (the files git tracks there, in a zip
# written the same way on every computer), computes each size and
# SHA-256, and writes crates/diroxide-components/components.toml, the
# public list the diro binary embeds. Never type a size or a hash: the
# xtask computes them, and cargo xtask regen --check fails when the list
# is stale.
#
# Per component: id, title (what it is, meaning first), kind (plugin,
# helper or data), version, license (SPDX), license_note, credit,
# features, needs_tools, needs_components, protocol, min_diro, action
# (place or unpack), folder (the id by default).
# Per file ([[component.file]]): name, target (a triple, or any), exec,
# strip, url (only when the file is not a release asset of this project),
# and pack: a list of parts, each { from = "folder" or one tracked file,
# as = "path in the zip", optional = true when the folder may not be
# there yet }, or { asset = "target/program", as = "..." }, a prebuilt
# file from cargo xtask components --assets FOLDER.
#
# A file is published as a release asset under the tag <id>-<version>;
# the program derives its address from the repository, that tag and the
# file's name, so no account name is written here.

format = 1

# The example plugins and script commands (R22 section 6.4): the first
# component, and the end-to-end test of the whole path with no network.
[[component]]
id = "diro-examples"
title = "Example plugins"
kind = "data"
version = "0.1.0"
license = "Apache-2.0 OR MIT"
credit = "The diroxide project"
features = ["examples"]
min_diro = "0.1.0-alpha.2"
action = "unpack"

[[component.file]]
name = "diro-examples-0.1.0.zip"
target = "any"
pack = [
  { from = "packaging/components/diro-examples", as = "" },
  { from = "examples/plugins", as = "plugins", optional = true },
]

# The SFTP places plugin (R25 commit 87; question N13): its program is
# built by the release workflow for each computer below, from its own
# workspace in plugins/diro-sftp, and handed to cargo xtask components as
# --assets FOLDER (FOLDER/<target>/diro-sftp, diro-sftp.exe on Windows).
# Without the assets the component is left out of the list, so the list
# committed here stays current; the release regenerates it with them
# before it builds diro. Another computer hears "No build for this
# computer." and the cargo install line that builds it there.
[[component]]
id = "diro-sftp"
title = "SFTP places plugin"
kind = "plugin"
version = "0.1.0-alpha.1"
license = "Apache-2.0 OR MIT"
credit = "The diroxide project"
features = ["sftp"]
needs_tools = ["ssh"]
protocol = 1
min_diro = "0.1.0-alpha.2"
action = "unpack"

[[component.file]]
name = "diro-sftp-0.1.0-alpha.1-x86_64-pc-windows-msvc.zip"
target = "x86_64-pc-windows-msvc"
exec = "diro-sftp.exe"
pack = [
  { from = "plugins/diro-sftp/plugin.toml", as = "" },
  { asset = "x86_64-pc-windows-msvc/diro-sftp.exe", as = "" },
]

[[component.file]]
name = "diro-sftp-0.1.0-alpha.1-x86_64-unknown-linux-gnu.zip"
target = "x86_64-unknown-linux-gnu"
exec = "diro-sftp"
pack = [
  { from = "plugins/diro-sftp/plugin.toml", as = "" },
  { asset = "x86_64-unknown-linux-gnu/diro-sftp", as = "" },
]

[[component.file]]
name = "diro-sftp-0.1.0-alpha.1-universal-apple-darwin.zip"
target = "universal-apple-darwin"
exec = "diro-sftp"
pack = [
  { from = "plugins/diro-sftp/plugin.toml", as = "" },
  { asset = "universal-apple-darwin/diro-sftp", as = "" },
]
