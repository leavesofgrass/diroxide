[package]
name = "diroxide-archive"
description = "The archive provider of diroxide: zip, 7z, tar, tar.gz, tar.xz and xz, reading and writing, with limits."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
# The format crates (W2a and W2b), all pure Rust; depended on from the
# alpha.2 contract step so the license and native gates read them.
bzip2.workspace = true
# The CRC check at the end of every member read.
crc32fast.workspace = true
diroxide-core.workspace = true
# The engine's types the runners speak (the sink, the control, the
# report, the conflict question) and the parts reader of split archives;
# the dependency direction allows it (xtask deps).
diroxide-ops.workspace = true
diroxide-vfs.workspace = true
flate2.workspace = true
lzma-rust2.workspace = true
sevenz-rust2.workspace = true
tar.workspace = true
thiserror.workspace = true
zip.workspace = true

[dev-dependencies]
proptest.workspace = true
# The canary test reads serialized requests (ADR-0009).
serde_json.workspace = true
# Resident memory for the spikes (research/alpha2-plan.md 4.1 and 4.2).
sysinfo.workspace = true
tempfile.workspace = true

[lints]
workspace = true
