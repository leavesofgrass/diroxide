# Contrast: Pure yellow and cyan on black; star's original contrast theme.
#
# Ported from star's `contrast` palette (star/themes.py).
# Error color: the color star's terminal table used for errors (#ff80ff).
# Every star color meets the contrast floor unchanged.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "contrast"
display_name = "Contrast"
kind = "high-contrast"
description = "Pure yellow and cyan on black; star's original contrast theme."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"

[colors]
background = "#000000"
surface = "#1a1a1a"
text = "#ffffff"
dim_text = "#c0c0c0"
heading1 = "#ffff00"
heading2 = "#00ffff"
heading3 = "#ff80ff"
heading4 = "#80ff80"
heading5 = "#80ff80"
heading6 = "#80ff80"
link = "#00ffff"
code = "#00ff80"
code_background = "#1a1a1a"
quote = "#c0c0c0"
error = "#ff80ff"

[styles.selection]
foreground = "#ffffff"
background = "#404040"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#000000"
background = "#ffff00"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#ffffff"
background = "#404040"
attributes = ["underline"]

[styles.find_hit]
foreground = "#000000"
background = "#ff80ff"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#000000"
background = "#00ffff"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#80ff80"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#00ff80"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#000000"
background = "#ffff00"
attributes = ["bold"]

[styles.focus]
foreground = "#000000"
background = "#00ffff"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#ffffff"
background = "#4d4003"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#ffffff"
background = "#103c1b"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#ffffff"
background = "#03284d"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#ffffff"
background = "#4d1d31"
attributes = ["bold"]
