# Light: star's original light theme.
#
# Ported from star's `light` palette (star/themes.py).
# Error color: the color star's terminal table used for errors (#a1239b).
# star's colors, unchanged. Does not meet WCAG AA: 5 of 61 contrast checks fall short.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "light"
display_name = "Light"
kind = "light"
description = "star's original light theme."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"
counterpart = "dark"

[colors]
background = "#fafafa"
surface = "#eceff4"
text = "#24273a"
dim_text = "#8c8fa1"
heading1 = "#1e66f5"
heading2 = "#209fb5"
heading3 = "#8839ef"
heading4 = "#e64553"
heading5 = "#d63547"
heading6 = "#d63547"
link = "#1e66f5"
code = "#40a02b"
code_background = "#eceff4"
quote = "#6f7284"
error = "#a1239b"

[styles.selection]
foreground = "#24273a"
background = "#bcd0f0"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#fafafa"
background = "#1e66f5"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#24273a"
background = "#bcd0f0"
attributes = ["underline"]

[styles.find_hit]
foreground = "#fafafa"
background = "#8839ef"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#fafafa"
background = "#007f95"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#d63547"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#218500"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#fafafa"
background = "#1e66f5"
attributes = ["bold"]

[styles.focus]
foreground = "#fafafa"
background = "#1e66f5"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#24273a"
background = "#fceda6"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#24273a"
background = "#b5e8c2"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#24273a"
background = "#a6d1fc"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#24273a"
background = "#fcc4db"
attributes = ["bold"]
