[package]
name = "diro"
description = "diro, the two-panel file manager Directory Oxide (diroxide): keyboard first, accessible first, plugins in any language."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "diro"
path = "src/main.rs"

[features]
default = ["fetch", "syntax-set", "gui", "tui"]
# The GUI's window: Masonry, Vello, wgpu and AccessKit, vendored under
# third_party/ (docs/dev/vendoring.md). Every frontend is in the one
# program; `diro` chooses the GUI or the terminal at each start (the GUI
# alpha's contract step). `--no-default-features --features tui` builds
# the terminal alone, without Vello and wgpu.
gui = ["diroxide-cli/gui"]
# The terminal frontend, always built; a marker that names it.
tui = ["diroxide-cli/tui"]
# The viewer's syntax set: syntect with bat's grammars, about 3 MB of the
# binary (W2d's request 2, P2b). `--no-default-features` leaves it out with
# the downloader's client; add `--features fetch` to keep that one.
syntax-set = ["diroxide-cli/syntax-set"]
# The optional-components downloader's HTTP client (plan section 5.14):
# ureq with rustls, whose ring provider compiles C. The owner's one
# exception to the pure-Rust rule (answer 40), used by the components
# crate through the CLI (W4c). `--no-default-features` builds with no C
# compiler, and the downloader then uses curl or wget from PATH.
fetch = ["dep:ureq", "diroxide-cli/fetch"]

[dependencies]
diroxide-cli.workspace = true
ureq = { workspace = true, optional = true }

[lints]
workspace = true
