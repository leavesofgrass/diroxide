[package]
name = "diroxide-tools"
description = "The external tools registry of diroxide: ImageMagick, FFmpeg, pandoc and others, found on PATH and run without a shell."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
diroxide-config.workspace = true
diroxide-core.workspace = true
diroxide-vfs.workspace = true
# Process trees: a job object on Windows, a process group elsewhere, so a
# plugin or a tool is stopped with everything it started (process.rs).
process-wrap.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
