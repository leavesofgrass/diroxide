[package]
name = "diroxide-vfs"
description = "The virtual file system of diroxide: the provider trait, capabilities, cancellation, the registry and the local provider."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
diroxide-core.workspace = true
dirs.workspace = true
notify.workspace = true
reflink-copy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
trash.workspace = true

[target.'cfg(windows)'.dependencies]
# The job objects (JobObjects, and Threading for their extended limit
# information) are the process helper's kill-on-close job, W4a-2's. Pipes
# and Security's Authorization (the SDDL conversions) are the owner-only
# named pipe of answer 101, S-C's; Threading also gives its events and the
# process token.
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Security_Authorization"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true
sysinfo.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
