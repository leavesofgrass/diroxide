# Phosphor: Green phosphor monochrome.
#
# Ported from star's `phosphor` palette (star/themes.py).
# Error color: the color star's terminal table used for errors (#00ff00).
# star's colors, unchanged. Does not meet WCAG AA: 2 of 61 contrast checks fall short.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "phosphor"
display_name = "Phosphor"
kind = "dark"
description = "Green phosphor monochrome."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"

[colors]
background = "#001200"
surface = "#002600"
text = "#00cc00"
dim_text = "#008800"
heading1 = "#00ff00"
heading2 = "#00ee00"
heading3 = "#00cc00"
heading4 = "#00aa00"
heading5 = "#00aa00"
heading6 = "#00aa00"
link = "#00ff00"
code = "#009900"
code_background = "#002600"
quote = "#108e0e"
error = "#00ff00"

[styles.selection]
foreground = "#00cc00"
background = "#004400"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#001200"
background = "#00ff00"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#00cc00"
background = "#004400"
attributes = ["underline"]

[styles.find_hit]
foreground = "#001200"
background = "#00cc00"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#001200"
background = "#00ee00"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#00aa00"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#009900"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#001200"
background = "#00ff00"
attributes = ["bold"]

[styles.focus]
foreground = "#001200"
background = "#00ff00"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#00cc00"
background = "#464600"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#00cc00"
background = "#10481b"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#00cc00"
background = "#03344d"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#00cc00"
background = "#4d2931"
attributes = ["bold"]
