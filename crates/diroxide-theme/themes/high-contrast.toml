# High Contrast: Softened high contrast for low vision; every color at 7 to 1 or more.
#
# Ported from star's `high-contrast` palette (star/themes.py).
# Error color: the scheme's red (#ff9a8a); star had no error color.
# Every star color meets the contrast floor unchanged.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "high-contrast"
display_name = "High Contrast"
kind = "high-contrast"
description = "Softened high contrast for low vision; every color at 7 to 1 or more."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"

[colors]
background = "#000000"
surface = "#141414"
text = "#ffffff"
dim_text = "#c0c0c0"
heading1 = "#ffe14d"
heading2 = "#5fe3ff"
heading3 = "#ff9ce0"
heading4 = "#7dffb0"
heading5 = "#7dffb0"
heading6 = "#7dffb0"
link = "#8ac6ff"
code = "#ffbf66"
code_background = "#141414"
quote = "#c0c0c0"
error = "#ff9a8a"

[styles.selection]
foreground = "#ffffff"
background = "#2a2a2a"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#000000"
background = "#ffe14d"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#ffffff"
background = "#2a2a2a"
attributes = ["underline"]

[styles.find_hit]
foreground = "#000000"
background = "#ff9ce0"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#000000"
background = "#5fe3ff"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#7dffb0"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#ffbf66"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#000000"
background = "#ffe14d"
attributes = ["bold"]

[styles.focus]
foreground = "#000000"
background = "#8ac6ff"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#ffffff"
background = "#4d4003"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#ffffff"
background = "#103c1b"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#ffffff"
background = "#03284d"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#ffffff"
background = "#4d1d31"
attributes = ["bold"]
