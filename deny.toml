# cargo-deny's configuration: the license allow-list, banned and duplicate
# crates, and where crates may come from. CI runs `cargo deny check` on
# every push. diroxide is Apache-2.0 OR MIT, so every dependency's license
# must allow that.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
ignore = []

[licenses]
# Permissive licenses compatible with shipping diroxide as Apache-2.0 OR MIT.
# MPL-2.0 is file-level copyleft and fine as a dependency (dirs uses
# option-ext). Add a license here only with the orchestrator's review.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
exceptions = []
# The list anticipates the crates of later waves.
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
