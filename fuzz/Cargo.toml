# The fuzz targets of diroxide (plan section 6: cargo-fuzz over the name
# sanitizer, the archive readers and the protocol parser). A workspace of
# its own, outside the main one: libFuzzer is C++, so it never enters the
# main workspace's build (the pure-Rust rule), and the nightly workflow
# runs it with `cargo fuzz run names` on a nightly toolchain.

[package]
name = "diroxide-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
diroxide-core = { path = "../crates/diroxide-core" }
diroxide-vfs = { path = "../crates/diroxide-vfs" }

[[bin]]
name = "names"
path = "fuzz_targets/names.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter_pattern"
path = "fuzz_targets/filter_pattern.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter_parse"
path = "fuzz_targets/filter_parse.rs"
test = false
doc = false
bench = false

# Its own workspace, so the main one never builds it.
[workspace]
members = ["."]

# The archive targets (W2a). Each body is a plain function in
# diroxide-archive's `fuzzing` module, so the seeds under
# `fixtures/archives/seeds/` replay in the crate's normal tests.
[dependencies.diroxide-archive]
path = "../crates/diroxide-archive"

[[bin]]
name = "archive_names"
path = "fuzz_targets/archive_names.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_sniff"
path = "fuzz_targets/archive_sniff.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_zip"
path = "fuzz_targets/archive_zip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_tar"
path = "fuzz_targets/archive_tar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_stream"
path = "fuzz_targets/archive_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_xz"
path = "fuzz_targets/archive_xz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive_7z"
path = "fuzz_targets/archive_7z.rs"

# W2d: the highlighter must never hang (spike H2). Run with -timeout=2.
[dependencies.diroxide-preview]
path = "../crates/diroxide-preview"

[[bin]]
name = "highlight_hang"
path = "fuzz_targets/highlight_hang.rs"
test = false
doc = false
bench = false

# The round-trip target (W2b): diroxide's writers against its readers.
[[bin]]
name = "archive_roundtrip"
path = "fuzz_targets/archive_roundtrip.rs"
test = false
doc = false
bench = false
