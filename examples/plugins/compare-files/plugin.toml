# Compare in a diff tool: an example diroxide plugin with no code of its
# own. It opens two files in the diff program you choose, such as meld,
# kdiff3, WinMergeU, or code with --diff, started on its own so it stays
# open after diroxide returns. diroxide's own Compare files stays the
# default for the panels; this shows the pattern for an outside tool. A
# terminal program such as vimdiff needs mode = "terminal-wait" instead.

[plugin]
id = "compare-files"
name = "Compare in a diff tool"
version = "0.1.0"
description = "Opens two files in the diff program you choose."
license = "Apache-2.0 OR MIT"
protocol = 1
min_host = "0.1.0-alpha.2"

[permissions.declared]
network = "no network"
files = "only the two files it compares"
programs = "the diff program in its settings"

[[setting]]
key = "tool"
type = "argv"
default = []
description = "The diff program and its options, such as meld, or code with --diff."

[[command]]
id = "compare_panels"
name = "Compare the focused files of both panels"
description = "Opens the files under both cursors in your diff program."
selection = "none"
places = "local"
mode = "launch"
argv = ["{setting.tool}", "{file}", "{other_file}"]

[[command]]
id = "compare_marked"
name = "Compare the two marked files"
description = "Opens the two marked files in your diff program."
selection = "two"
places = "local"
mode = "launch"
argv = ["{setting.tool}", "{files}"]
