[package]
name = "diroxide-gui"
description = "The window frontend of diroxide on Masonry and AccessKit: each panel one accessible list box."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
# The window itself: Masonry, its winit runner with the Vello renderer,
# and AccessKit (the GUI alpha's contract step). Off, the crate still
# builds the frontend's model and `run` says the window was left out of
# this build. `diro` turns it on by default; `--no-default-features`
# leaves Vello and wgpu out of a build.
gui = [
    "dep:masonry",
    "dep:masonry_winit",
    "masonry_winit/imaging_vello",
    "dep:accesskit",
    "dep:accesskit_winit",
    "dep:fontique",
    "dep:tracing",
]

[dependencies]
diroxide-app.workspace = true
diroxide-core.workspace = true
thiserror.workspace = true
masonry = { workspace = true, optional = true }
masonry_winit = { workspace = true, optional = true }
accesskit = { workspace = true, optional = true }
accesskit_winit = { workspace = true, optional = true }
# A quiet trace subscriber for the window, so Masonry's own does not print
# to the terminal diro was started from.
tracing = { workspace = true, optional = true }

# Fontconfig is loaded when the window starts, never linked, so diro runs
# where it is not installed (a server, a container); the bundled fonts
# serve then.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
fontique = { workspace = true, optional = true, features = ["fontconfig-dlopen"] }

# The console a window program was started from (src/console.rs, the one
# module of this crate that may use `unsafe`).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
accesskit_consumer.workspace = true
masonry_testing.workspace = true
tempfile.workspace = true

# The harness reaches Parley, and so fontique with its system fonts,
# whether or not the `gui` feature is on: the tests build without it too
# (gui.yml's second run). Fontconfig is opened at run time there as
# well, never linked, so the tests build on a runner with no Fontconfig
# headers and no pkg-config (textweaver's way: its root manifest and
# crates/textweaver-xilem/Cargo.toml).
[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
fontique = { workspace = true, features = ["fontconfig-dlopen"] }

[lints]
workspace = true
