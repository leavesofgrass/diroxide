[package]
name = "diroxide-tui"
description = "The terminal frontend of diroxide: words first, the cursor on the focused row, no box drawing by default."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
crossterm.workspace = true
ctrlc.workspace = true
diroxide-app.workspace = true
diroxide-core.workspace = true
diroxide-theme.workspace = true
ratatui.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The viewer's tests draw highlighted code, so they turn on the syntax set
# the app leaves off by default (P2b).
diroxide-app = { workspace = true, features = ["syntax-set"] }
tempfile.workspace = true

[lints]
workspace = true
