# Tokyo Night: The Tokyo Night palette.
#
# Ported from star's `tokyo-night` palette (star/themes.py).
# Error color: star's terminal error color (xterm 210, #ff8787).
# star's colors, unchanged. Meets WCAG AA.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "tokyo-night"
display_name = "Tokyo Night"
kind = "dark"
description = "The Tokyo Night palette."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"

[colors]
background = "#1a1b26"
surface = "#24283b"
text = "#c0caf5"
dim_text = "#858dbb"
heading1 = "#7aa2f7"
heading2 = "#bb9af7"
heading3 = "#7dcfff"
heading4 = "#9ece6a"
heading5 = "#9ece6a"
heading6 = "#9ece6a"
link = "#7aa2f7"
code = "#e0af68"
code_background = "#24283b"
quote = "#858dbb"
error = "#ff8787"

[styles.selection]
foreground = "#c0caf5"
background = "#33467c"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#1a1b26"
background = "#7aa2f7"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#c0caf5"
background = "#33467c"
attributes = ["underline"]

[styles.find_hit]
foreground = "#1a1b26"
background = "#7dcfff"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#1a1b26"
background = "#bb9af7"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#9ece6a"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#e0af68"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#1a1b26"
background = "#7aa2f7"
attributes = ["bold"]

[styles.focus]
foreground = "#1a1b26"
background = "#7aa2f7"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#c0caf5"
background = "#5f531e"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#c0caf5"
background = "#224f35"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#c0caf5"
background = "#153b67"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#c0caf5"
background = "#5f2f4b"
attributes = ["bold"]
