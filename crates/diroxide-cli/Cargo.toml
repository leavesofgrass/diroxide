[package]
name = "diroxide-cli"
description = "The command line of diroxide behind the diro binary: open, serve, search, convert and plugin tooling."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
clap_complete.workspace = true
# The masked password prompt and the y-or-n questions of the archive,
# split and join subcommands read keys from the terminal, not from
# standard input, which stays free for lists of paths.
crossterm.workspace = true
diroxide-app.workspace = true
# diro archive, split and join (W2g): the archive provider, its runners,
# and the engine's split and join.
diroxide-archive.workspace = true
# diro components (W4c): the list, the downloader, install from a file.
diroxide-components.workspace = true
diroxide-config.workspace = true
diroxide-core.workspace = true
# diro diff (W3d): compare two files in words.
diroxide-diff.workspace = true
diroxide-filetype.workspace = true
# diro dups (alpha 5, lane CX): the duplicate finder's full hash is
# meta's BLAKE3, the one the Checksum command computes.
diroxide-meta.workspace = true
# The GUI frontend: its window behind the `gui` feature below; without it,
# `diro --gui` says the GUI was left out of this build.
diroxide-gui.workspace = true
diroxide-ops.workspace = true
diroxide-plugins.workspace = true
diroxide-search.workspace = true
# curl and wget for diro components, through the tools registry.
diroxide-tools.workspace = true
diroxide-tui.workspace = true
diroxide-vfs.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# diro watch (W3t): Ctrl+C ends the watch with its last line.
ctrlc.workspace = true

[dev-dependencies]
diroxide-theme.workspace = true
ratatui.workspace = true
tempfile.workspace = true

[features]
# The viewer's syntax set, forwarded to the app (W2d's request 2, P2b);
# `diro` turns it on by default.
syntax-set = ["diroxide-app/syntax-set"]
# The components downloader's built-in HTTPS client (answer 40), forwarded
# to the components crate; `diro` turns it on by default.
fetch = ["diroxide-components/fetch"]
# The GUI's window (Masonry, Vello, wgpu and AccessKit), forwarded to the
# GUI crate; `diro` turns it on by default (the GUI alpha's contract step).
gui = ["diroxide-gui/gui"]
# The terminal frontend, always built: a marker, so a build can name what
# it holds (`--no-default-features --features tui`).
tui = []

[lints]
workspace = true
