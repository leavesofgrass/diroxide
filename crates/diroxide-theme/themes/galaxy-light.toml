# Galaxy Light: Galaxy's light half: purple accents on white.
#
# Ported from star's `galaxy-light` palette (star/themes.py).
# Error color: the scheme's red (#c0264b); star had no error color.
# Changed to meet the contrast floor (smallest lightness change that passes):
#   colors.dim_text: #8a8f98 -> #727780 (3.2 to 1 -> 4.5 to 1 against #ffffff, needs 4.5 to 1)
#   colors.heading4: #1a9e8f -> #008577 (3.3 to 1 -> 4.5 to 1 against #ffffff, needs 4.5 to 1)
#   colors.code: #b5673a -> #a65a2c (3.7 to 1 -> 4.5 to 1 against #f2f0f9, needs 4.5 to 1)
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "galaxy-light"
display_name = "Galaxy Light"
kind = "light"
description = "Galaxy's light half: purple accents on white."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"
counterpart = "galaxy"

[colors]
background = "#ffffff"
surface = "#f2f0f9"
text = "#2e3338"
dim_text = "#727780"
heading1 = "#6c3fd6"
heading2 = "#8257e5"
heading3 = "#3a6df0"
heading4 = "#008577"
heading5 = "#008577"
heading6 = "#008577"
link = "#7c3aed"
code = "#a65a2c"
code_background = "#f2f0f9"
quote = "#727780"
error = "#c0264b"

[styles.selection]
foreground = "#2e3338"
background = "#d8caff"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#ffffff"
background = "#6c3fd6"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#2e3338"
background = "#d8caff"
attributes = ["underline"]

[styles.find_hit]
foreground = "#ffffff"
background = "#3a6df0"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#ffffff"
background = "#8257e5"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#008577"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#a65a2c"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#ffffff"
background = "#6c3fd6"
attributes = ["bold"]

[styles.focus]
foreground = "#ffffff"
background = "#7c3aed"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#2e3338"
background = "#fff1a9"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#2e3338"
background = "#b8ebc5"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#2e3338"
background = "#a9d4ff"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#2e3338"
background = "#ffc7de"
attributes = ["bold"]
