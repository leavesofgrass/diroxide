# The GUI's own checks, apart from ci.yml, as textweaver keeps its window's
# checks apart (the GUI alpha's contract step): the in-process
# accessibility harness on each system with no display and no graphics
# card, and the one program's start on each runner. On Windows the
# terminal and the subcommands keep their pipes and the GUI opens off
# screen, never in front, or says in words why it cannot; on Linux, with
# no display, the GUI says so and the terminal opens. The reports (the GUI
# alpha's foundation lane): what UI Automation gives a screen reader on
# Windows and what AT-SPI gives Orca on Linux, each in the run's summary
# and as an artifact. ci.yml compiles the GUI with every other check
# (--all-features); this workflow runs it. Plain logs, no color, so they
# read well in a screen reader.
name: GUI

on:
  push:
    branches: [main, "alpha3/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  harness:
    name: Accessibility harness on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The window's tree under masonry_testing: no window, no display, no
      # GPU. Spike S6 measured about 20 ms and 16 MB a test, so the tests
      # keep nextest's parallelism (no test group).
      - name: The window's tree, with and without the gui feature
        run: |
          cargo nextest run -p diroxide-gui --all-features
          cargo nextest run -p diroxide-gui

  start-windows:
    name: One program on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p diro
      # Spike S8: diro.exe is a console program (subsystem 3), so shells
      # wait for it and its pipes work; --tui through a pipe prints one
      # screen of plain lines.
      - name: The terminal and the subcommands through pipes
        shell: pwsh
        run: |
          $diro = (Resolve-Path target/debug/diro.exe).Path
          $bytes = [IO.File]::ReadAllBytes($diro)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          "Subsystem: $subsystem (3 is a console program)"
          if ($subsystem -ne 3) { "Fail: diro.exe is not a console program."; exit 1 }
          & $diro ls . | findstr /b Cargo
          if ($LASTEXITCODE -ne 0) { "Fail: diro ls through findstr found no Cargo files."; exit 1 }
          $null | & $diro serve --stdio
          if ($LASTEXITCODE -ne 0) { "Fail: diro serve --stdio did not end at the end of its input."; exit 1 }
          $screen = & $diro --tui --portable . | Out-String
          if ($screen -notmatch 'left panel') { "Fail: diro --tui through a pipe printed no screen."; $screen; exit 1 }
          "Pass: ls, serve and --tui through pipes."
      # The window, off screen and never activated (--background). The
      # runner has no graphics card, only Windows' software adapter (WARP),
      # whose compute shaders Vello's GPU renderer cannot rely on: the
      # window draws on the processor instead (R27's commit 31, the
      # owner's answer 106), Vello's CPU renderer presented through
      # softbuffer, and --log says the road and the frames presented. A
      # window that does not open, or a crash, fails the run; so does a
      # start that says it could not draw.
      - name: The GUI off screen, drawn on the processor
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Runtime.InteropServices;
          public static class Windows {
            delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool PostMessage(IntPtr h, uint msg, IntPtr w, IntPtr l);
            public static IntPtr Titled(uint pid, string end, out string title) {
              IntPtr found = IntPtr.Zero; string seen = "";
              EnumWindows((h, l) => {
                uint p; GetWindowThreadProcessId(h, out p);
                var s = new StringBuilder(512); GetWindowText(h, s, 512);
                if (p == pid && s.ToString().EndsWith(end)) { found = h; seen = s.ToString(); return false; }
                return true;
              }, IntPtr.Zero);
              title = seen; return found;
            }
          }
          '@
          $diro = (Resolve-Path target/debug/diro.exe).Path
          $out = Join-Path $env:RUNNER_TEMP 'gui-out.txt'
          $err = Join-Path $env:RUNNER_TEMP 'gui-err.txt'
          $log = Join-Path $env:RUNNER_TEMP 'gui-log.txt'
          $p = Start-Process -FilePath $diro -ArgumentList '--gui', '--background', '--portable', '--log', $log, '.' -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          # Reading the handle now keeps the exit code readable after the end.
          $null = $p.Handle
          $deadline = (Get-Date).AddSeconds(30)
          $window = [IntPtr]::Zero
          $title = ''
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
            $window = [Windows]::Titled([uint32]$p.Id, ' - diroxide', [ref]$title)
            if ($window -ne [IntPtr]::Zero) { break }
            Start-Sleep -Milliseconds 250
          }
          if ($window -ne [IntPtr]::Zero) {
            "Window title: $title"
            Start-Sleep -Seconds 2
            [void][Windows]::PostMessage($window, 0x0010, [IntPtr]::Zero, [IntPtr]::Zero)
            if (-not $p.WaitForExit(15000)) { "Fail: the window did not close."; Stop-Process -Id $p.Id; exit 1 }
            "Exit code after closing: $($p.ExitCode)"
            if ($p.ExitCode -ne 0) { Get-Content -Raw $err; exit 1 }
            $drawn = Get-Content -Raw $log
            "The drawing road (--log):"
            $drawn
            if ($drawn -notmatch 'graphics: drawing with ') { "Fail: the log names no drawing road."; exit 1 }
            if ($drawn -match 'graphics: 0 frames presented') { "Fail: no frame was presented."; exit 1 }
            "Pass: the window opened, drew, was titled with its place, and quit by the app's rule."
          } elseif ($p.HasExited) {
            "diro said: $(Get-Content -Raw $out)"
            if (Test-Path $log) { Get-Content -Raw $log }
            "Fail: diro ended without a window (exit $($p.ExitCode))."; Get-Content -Raw $err; exit 1
          } else {
            "Fail: no window within 30 seconds."; Stop-Process -Id $p.Id; exit 1
          }

  start-linux:
    name: The GUI with no display on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p diro
      # No WAYLAND_DISPLAY or DISPLAY on the runner: --gui says why and the
      # terminal opens, printing one screen through the pipe.
      - name: The GUI asked for with no display
        run: |
          unset WAYLAND_DISPLAY DISPLAY
          target/debug/diro --gui --portable . > gui-out.txt
          head -n 2 gui-out.txt
          grep -q '^There is no display for the GUI' gui-out.txt
          grep -q 'left panel' gui-out.txt
          echo "Pass: no display is said, and the terminal opens."

  # What a screen reader gets on Windows, through UI Automation (R27's
  # commit 15): tools/a11y/uia-report.ps1 opens the window off screen and
  # never activated, writes every element's type, name and patterns, the
  # panels' options with their positions and set size, the menu bar (shown
  # for this run), the live-region events, the process's top-level windows
  # and whether the window took the foreground, then closes it, with the
  # drawing road from --log. The runner has no graphics card, so the
  # window draws on the processor (R27's commit 31); the report stays
  # report-only until its first green run on that road has been read.
  report-windows:
    name: UI Automation report on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p diro
      - name: The UI Automation report
        continue-on-error: true
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/a11y/uia-report.ps1 -Out uia-diroxide.md -Settings 'auto_hide_menu = false' -Log (Join-Path $env:RUNNER_TEMP 'uia-log.txt')
          Get-Content -Raw uia-diroxide.md | Add-Content -Path $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uia-report
          path: uia-diroxide.md
          if-no-files-found: warn

  # What Orca gets on Linux, through AT-SPI: tools/a11y/atspi-check.sh
  # under Xvfb with a private D-Bus session and the AT-SPI bus, on Mesa's
  # software Vulkan, with the packages of the GUI image stage
  # (docker/Dockerfile, target gui). lavapipe is a software adapter, so
  # the window draws on the processor through softbuffer on X11 (R27's
  # commit 31); report-only until its first green run on that road has
  # been read.
  report-linux:
    name: AT-SPI report on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: The display, the AT-SPI bus and Mesa's software Vulkan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            xvfb xauth dbus dbus-x11 at-spi2-core python3-pyatspi python3-gi gir1.2-atspi-2.0 \
            mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri libegl1 \
            libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libx11-xcb1
      - run: cargo build -p diro
      - name: The AT-SPI report
        continue-on-error: true
        run: |
          bash tools/a11y/atspi-check.sh | tee atspi-diroxide.md
          cat atspi-diroxide.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atspi-report
          path: atspi-diroxide.md
          if-no-files-found: warn
