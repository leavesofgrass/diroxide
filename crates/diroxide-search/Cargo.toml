[package]
name = "diroxide-search"
description = "Name and content search, dirsize and duplicates for diroxide, with results as a list."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
diroxide-core.workspace = true
diroxide-vfs.workspace = true
# Content search: ripgrep's searcher and its regex matcher (plan section
# 5.5), with binary detection set and byte-order marks sniffed.
grep-regex.workspace = true
grep-searcher.workspace = true
# ripgrep's parallel walker, with its standard filters off (the plan's
# section 5.5 and R14): diroxide decides hidden entries itself.
ignore.workspace = true
regex.workspace = true
# Saved searches: one TOML file each, in the shape collections will read.
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
