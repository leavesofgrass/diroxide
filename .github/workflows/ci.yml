# The checks every push and pull request must pass. Plain logs, no color,
# so they read well in a screen reader.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"
  # Every job runs the slow tests (docs/dev/building.md, "Slow tests").
  # The container step below passes it in with --env.
  DIRO_SLOW: "1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Clippy, warnings denied
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features
      # The SFTP plugin from its own workspace, on the Windows and macOS legs
      # (the Linux leg runs it in the container below, against OpenSSH):
      # the release builds it for each computer, and no other job compiles
      # it there. --locked, as the release does.
      - name: SFTP plugin, clippy and tests from its own workspace
        if: runner.os != 'Linux'
        run: |
          cargo clippy --manifest-path plugins/diro-sftp/Cargo.toml --all-targets --all-features --locked -- -D warnings
          cargo nextest run --manifest-path plugins/diro-sftp/Cargo.toml --all-features --locked
      # The disk-image and git plugins from their own workspaces, on every
      # leg (alpha 4's contract step): no server to start, and the release
      # builds them for each computer, so no other job compiles them there.
      # --locked, as the release does.
      - name: Disk and git plugins, clippy and tests from their own workspaces
        shell: bash
        run: |
          for plugin in diro-disk diro-git; do
            cargo clippy --manifest-path "plugins/$plugin/Cargo.toml" --all-targets --all-features --locked -- -D warnings
            cargo nextest run --manifest-path "plugins/$plugin/Cargo.toml" --all-features --locked
          done
      # The SFTP plugin against a real OpenSSH server (answer 99), on the
      # Linux leg only: in the development image, which holds Debian's
      # openssh-server. The tests start and stop their own sshd on a
      # loopback port inside the container, with keys and a password made
      # for the run; nothing listens outside it (docker/sftp/).
      - name: SFTP plugin against OpenSSH, in the development container
        if: runner.os == 'Linux'
        run: |
          docker build --file docker/Dockerfile --tag diroxide-dev .
          docker run --rm --user root --volume "$PWD:/work" --workdir /work \
            --env CARGO_TARGET_DIR=/target --env CARGO_TERM_COLOR=never \
            --env DIRO_SLOW \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/work \
            diroxide-dev bash docker/sftp/run-tests.sh

  docs:
    name: Rustdoc, warnings denied
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  workspace:
    name: Dependency direction and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask deps --check
      # The pure-Rust gate: no cc, cmake or cxx build dependency in the
      # main workspace but ring for the fetch feature (plan section 4).
      - run: cargo xtask native --check
      - run: cargo xtask keyboard --check
      - run: cargo xtask regen --check

  deny:
    name: Licenses, bans, sources and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz-check:
    name: Fuzz targets compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # The fuzz targets are built with a nightly compiler only at night
      # (fuzz.yml); by day this check, with the pinned toolchain, catches a
      # target that no longer compiles. Each fuzz folder starts from its
      # workspace's lock, as fuzz.yml does (docs/dev/fuzzing.md).
      - name: Start from the workspace locks
        run: |
          cp Cargo.lock fuzz/Cargo.lock
          cp plugins/diro-sftp/Cargo.lock plugins/diro-sftp/fuzz/Cargo.lock
          cp plugins/diro-disk/Cargo.lock plugins/diro-disk/fuzz/Cargo.lock
          cp plugins/diro-git/Cargo.lock plugins/diro-git/fuzz/Cargo.lock
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            fuzz
            plugins/diro-sftp/fuzz
            plugins/diro-disk/fuzz
            plugins/diro-git/fuzz
      - name: Check every fuzz target
        run: |
          cargo check --manifest-path fuzz/Cargo.toml --bins
          cargo check --manifest-path plugins/diro-sftp/fuzz/Cargo.toml --bins
          cargo check --manifest-path plugins/diro-disk/fuzz/Cargo.toml --bins
          cargo check --manifest-path plugins/diro-git/fuzz/Cargo.toml --bins
