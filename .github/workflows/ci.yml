# The checks every push and pull request must pass. Plain logs, no color,
# so they read well in a screen reader.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: "1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    name: Clippy, warnings denied
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: Tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features
      # The SFTP plugin against a real OpenSSH server (answer 99), on the
      # Linux leg only: in the development image, which holds Debian's
      # openssh-server. The tests start and stop their own sshd on a
      # loopback port inside the container, with keys and a password made
      # for the run; nothing listens outside it (docker/sftp/).
      - name: SFTP plugin against OpenSSH, in the development container
        if: runner.os == 'Linux'
        run: |
          docker build --file docker/Dockerfile --tag diroxide-dev .
          docker run --rm --user root --volume "$PWD:/work" --workdir /work \
            --env CARGO_TARGET_DIR=/target --env CARGO_TERM_COLOR=never \
            --env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/work \
            diroxide-dev bash docker/sftp/run-tests.sh

  docs:
    name: Rustdoc, warnings denied
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  workspace:
    name: Dependency direction and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask deps --check
      # The pure-Rust gate: no cc, cmake or cxx build dependency in the
      # main workspace but ring for the fetch feature (plan section 4).
      - run: cargo xtask native --check
      - run: cargo xtask keyboard --check
      - run: cargo xtask regen --check

  deny:
    name: Licenses, bans, sources and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
