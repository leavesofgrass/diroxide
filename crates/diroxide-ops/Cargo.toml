[package]
name = "diroxide-ops"
description = "The job engine of diroxide: plans, progress in words, conflicts, cancel and the undo log."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
# carta's writers for conversions (alpha 4, lane CL, with the
# orchestrator's go): whole documents (`standalone`), and plain text, GFM
# and CommonMark beside the root's AsciiDoc, Typst, LaTeX, MediaWiki, Org,
# DOCX and EPUB writers. No Typst reader; includes neutralized.
carta = { workspace = true, features = ["standalone", "write-plain", "write-gfm", "write-commonmark"] }
# The split sidecar's CRC-32 (W2c).
crc32fast.workspace = true
diroxide-core.workspace = true
diroxide-vfs.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# The conversion recipes' TOML: the embedded conversions.toml and the
# recipes a plugin or the owner's file gives (alpha 4, lane CL).
toml.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
