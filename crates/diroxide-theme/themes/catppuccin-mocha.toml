# Catppuccin Mocha: The Catppuccin Mocha pastel palette.
#
# Ported from star's `catppuccin-mocha` palette (star/themes.py).
# Error color: star's terminal error color (xterm 211, #ff87af).
# star's colors, unchanged. Meets WCAG AA.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "catppuccin-mocha"
display_name = "Catppuccin Mocha"
kind = "dark"
description = "The Catppuccin Mocha pastel palette."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"

[colors]
background = "#1e1e2e"
surface = "#181825"
text = "#cdd6f4"
dim_text = "#9399b2"
heading1 = "#cba6f7"
heading2 = "#f5c2e7"
heading3 = "#89dceb"
heading4 = "#a6e3a1"
heading5 = "#a6e3a1"
heading6 = "#a6e3a1"
link = "#89b4fa"
code = "#fab387"
code_background = "#181825"
quote = "#9399b2"
error = "#ff87af"

[styles.selection]
foreground = "#cdd6f4"
background = "#45475a"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#1e1e2e"
background = "#cba6f7"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#cdd6f4"
background = "#45475a"
attributes = ["underline"]

[styles.find_hit]
foreground = "#1e1e2e"
background = "#89dceb"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#1e1e2e"
background = "#f5c2e7"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#a6e3a1"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#fab387"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#1e1e2e"
background = "#cba6f7"
attributes = ["bold"]

[styles.focus]
foreground = "#1e1e2e"
background = "#89b4fa"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#cdd6f4"
background = "#625523"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#cdd6f4"
background = "#25513b"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#cdd6f4"
background = "#183d6d"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#cdd6f4"
background = "#623251"
attributes = ["bold"]
