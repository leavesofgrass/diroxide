[package]
name = "xtask"
description = "The workspace's own tasks: the dependency direction check, generated files, the keyboard reference."
version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
diroxide-app.workspace = true
# The bench's archive scenarios and the demo's locked.zip go through the
# archive provider and its runners (P2b, W2g's request 1).
diroxide-archive.workspace = true
# cargo xtask components writes the list the components crate reads, and
# reads it back with the same reader (W4c).
diroxide-components.workspace = true
diroxide-core.workspace = true
diroxide-ops.workspace = true
# The bench's search scenarios run the search engine itself (W3s's
# request 2, as P2b did for the archive scenarios).
diroxide-search.workspace = true
diroxide-vfs.workspace = true
resvg.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
# cargo xtask demo reads locked.zip back with its password through the
# zip crate, a reader of its own beside diroxide's.
zip.workspace = true

[lints]
workspace = true
