# Solarized Light: Solarized light, nudged for contrast.
#
# Ported from star's `solarized-light` palette (star/themes.py).
# Error color: star's terminal error color (xterm 160, #d70000).
# star's colors, unchanged. Does not meet WCAG AA: 1 of 61 contrast checks fall short.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "solarized-light"
display_name = "Solarized Light"
kind = "light"
description = "Solarized light, nudged for contrast."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"
counterpart = "solarized-dark"

[colors]
background = "#fdf6e3"
surface = "#f1ebd8"
text = "#586e75"
dim_text = "#5e7070"
heading1 = "#1b6194"
heading2 = "#1b6b65"
heading3 = "#566500"
heading4 = "#7f6100"
heading5 = "#7f6100"
heading6 = "#7f6100"
link = "#1b6194"
code = "#b34212"
code_background = "#eee8d5"
quote = "#5e7070"
error = "#d70000"

[styles.selection]
foreground = "#566c73"
background = "#eee8d5"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#fdf6e3"
background = "#1b6194"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#586e75"
background = "#f1ebd8"
attributes = ["underline"]

[styles.find_hit]
foreground = "#fdf6e3"
background = "#566500"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#fdf6e3"
background = "#1b6b65"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#7f6100"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#b34212"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#fdf6e3"
background = "#1b6194"
attributes = ["bold"]

[styles.focus]
foreground = "#fdf6e3"
background = "#1b6194"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#586e75"
background = "#ffec98"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#586e75"
background = "#c8f8c4"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#586e75"
background = "#cbf2ff"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#586e75"
background = "#ffe4ef"
attributes = ["bold"]
