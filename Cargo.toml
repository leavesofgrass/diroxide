[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# Plugins live in workspaces of their own (plan section 5.8, item 3): the
# main workspace, and so `cargo install diro`, never sees what they build.
exclude = ["plugins"]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
license = "Apache-2.0 OR MIT"
homepage = "https://diroxide.app"
# Nothing is published until the owner says so.
publish = false

# Every dependency is declared once, here. Member crates take what they need
# with `name.workspace = true`; `cargo xtask deps --check` enforces both that
# and the direction of the internal dependencies (docs/dev/architecture.md).
#
# The pure-Rust goal (plan section 4, principle 5; answer 46: a goal, not
# a rule): a crate that brings a C, C++ or assembly build into the main
# workspace enters only through the inventory in `xtask/src/native.rs`,
# with its reason, in the same commit. `cargo xtask native --check` fails
# on any other `cc`, `cmake` or `cxx` build dependency in the build tree.
# The inventory: `ring` (through `rustls` through `ureq`), the
# downloader's TLS provider behind the `fetch` feature of `diro` (the
# owner's exception, Sunday, October 11, 2026); `psm` and `stacker`
# (through `carta`), the converter's stack growth (alpha.2's contract
# step, Friday, October 16, 2026).
[workspace.dependencies]
# The workspace's own crates.
diroxide-core = { path = "crates/diroxide-core", version = "0.1.0-alpha.1" }
diroxide-vfs = { path = "crates/diroxide-vfs", version = "0.1.0-alpha.1" }
diroxide-archive = { path = "crates/diroxide-archive", version = "0.1.0-alpha.1" }
diroxide-ops = { path = "crates/diroxide-ops", version = "0.1.0-alpha.1" }
diroxide-search = { path = "crates/diroxide-search", version = "0.1.0-alpha.1" }
diroxide-filetype = { path = "crates/diroxide-filetype", version = "0.1.0-alpha.1" }
diroxide-config = { path = "crates/diroxide-config", version = "0.1.0-alpha.1" }
diroxide-plugins = { path = "crates/diroxide-plugins", version = "0.1.0-alpha.1" }
diroxide-tools = { path = "crates/diroxide-tools", version = "0.1.0-alpha.1" }
diroxide-preview = { path = "crates/diroxide-preview", version = "0.1.0-alpha.1" }
diroxide-theme = { path = "crates/diroxide-theme", version = "0.1.0-alpha.1" }
diroxide-app = { path = "crates/diroxide-app", version = "0.1.0-alpha.1" }
diroxide-tui = { path = "crates/diroxide-tui", version = "0.1.0-alpha.1" }
diroxide-gui = { path = "crates/diroxide-gui", version = "0.1.0-alpha.1" }
diroxide-cli = { path = "crates/diroxide-cli", version = "0.1.0-alpha.1" }

# Used by the contract (Phase 0 and the Wave 1 amendments).
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.146"
thiserror = "2.0.18"
toml = "1.1.6"
# The pattern module of diroxide-core (globs and `re:` patterns).
regex = "1.13.1"
# Secrets: a wrapper that zeroizes and redacts (research/encryption.md).
secrecy = "0.10.3"
zeroize = "1.8.1"

# Declared for the waves to come (plan section 6), not yet depended on, so
# the first build stays small. Versions are textweaver's where it uses the
# crate, so the two projects share a cache.
#
# Search: ripgrep's crates (MIT or Unlicense). The `ignore` and
# `grep-searcher` pins were checked on Friday, October 16, 2026.
ignore = "0.4.33"
globset = "0.4.18"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
# Archives (research/archives.md section 15 F; plan question 6 closed by
# answer 26). zip 9.0.1 exactly, as decided (9.0.4 exists, but it moved
# to lzma-rust2 0.22; a bump is the orchestrator's, with sevenz-rust2).
# lzma-rust2 on the 0.21 line that zip 9.0.1 and sevenz-rust2 0.23 share,
# so one copy is compiled (`cargo tree -d` shows one); `optimization` on
# (owner question 5's default, hand-written `unsafe` inside the crate).
# liblzma has left the main workspace under the plugin boundary; there is
# no `xz-c` feature. Since the alpha.2 contract step (P2) the archive
# crate depends on these, so the license and native gates read them.
zip = { version = "=9.0.1", default-features = false, features = ["deflate-flate2-zlib-rs", "bzip2", "aes-crypto", "lzma", "xz", "ppmd", "deflate64"] }
lzma-rust2 = { version = "0.21.0", default-features = false, features = ["std", "encoder", "xz", "optimization"] }
sevenz-rust2 = { version = "=0.23.0", default-features = false, features = ["compress", "aes256", "bzip2", "ppmd", "util"] }
tar = { version = "0.4.46", default-features = false }
flate2 = { version = "1.1.5", default-features = false, features = ["zlib-rs"] }
# bzip2 0.6 reads and writes through libbz2-rs-sys, a Rust port (no C).
bzip2 = "0.6.1"
# CRC-32 for the split sidecar (`.crc`, plan section 5.4) and the archive
# checks; already in the graph through zip, declared for the ops crate.
crc32fast = "1.5.2"
# The local provider's `sys` module (research/file-operations.md C6):
# safe Unix wrappers, the Windows calls, and copy-on-write clones.
rustix = { version = "1.1.5", features = ["fs"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
reflink-copy = "0.1.30"
# Watching, trash, volumes, folders, hashing. trash 5.2.9 is the version
# spikes four and six measured; it is used only behind the trash gate
# (plan section 5.12). Keep sysinfo on its default features.
notify = "8.2.0"
# Without its default chrono feature, which reaches a C build dependency
# through a Haiku-only time-zone crate (W1a's contract request 1).
trash = { version = "=5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
sysinfo = "0.36.1"
dirs = "6.0.0"
# blake3 always builds with `cc` (a non-optional build dependency), so the
# native gate fails the day a crate depends on it, even with `pure`. Before
# the duplicate finder (alpha.8) uses it, the owner decides: a second allow
# entry for blake3 with `pure`, or a pure-Rust hash (sha2 is declared).
blake3 = { version = "1.8.2", features = ["pure"] }
# Pins for the components downloader and checksums.
sha2 = "0.10.9"
# Comment-preserving writes of the owner's TOML files (plan section 5.11).
toml_edit = "0.25.15"
# Opening a file with the system's program, never through a shell; opener,
# not open, which starts PowerShell for every open (spike four).
opener = "0.8.5"
# Process trees: job objects on Windows, process groups elsewhere
# (research/alpha4-plan.md). No async runtime in the main binary.
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "creation-flags", "job-object", "kill-on-drop", "process-group", "process-session"] }
# The downloader's HTTP client, the owner's one exception to the pure-Rust
# rule (answer 40): textweaver's pin, rustls with the ring provider,
# behind the default `fetch` feature of `diro` only.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
# Compare (alpha.3, research/diffing.md): std, text and inline only.
similar = { version = "3.2.0", default-features = false, features = ["std", "text", "inline"] }
# Highlighting and documents (alpha.2, research/syntax-highlighting.md and
# research/alpha2-plan.md 4.5 and 4.6), depended on by the preview crate
# since the alpha.2 contract step (P2). syntect as a tokenizer: parsing
# with the fancy-regex engine, never Oniguruma (C), and none of its
# themes, plist, YAML or HTML features; two-face brings bat's grammars.
# Both run at full speed in debug builds (the profile entries below).
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
# Text decoding: textweaver's encoding module carries over whole (answer
# 41); (Apache-2.0 OR MIT) AND BSD-3-Clause, both allowed.
encoding_rs = "0.8.42"
# carta, the pure-Rust converter (answer 27): pinned exactly, textweaver's
# pin, default features off (no CLI, no `fetch`, no highlight grammars),
# with the five readers the quick view uses. Its include directives are
# never followed and its Typst reader is never used. The writer feature
# (`write-commonmark` for path B, `write-html` for path A) is added by
# W2e after spike C1 (plan question 66); a bump waits for the twelve
# samples. MIT OR Apache-2.0.
carta = { version = "=0.0.11", default-features = false, features = ["read-org", "read-rst", "read-mediawiki", "read-dokuwiki", "read-jira"] }
# scraper 0.27.0 (ISC, allowed) is declared only if spike C1 chooses path
# A (an HTML-fragment reader carried from textweaver's html.rs); not now.
# Detection and images.
infer = "0.19" # unverified
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.6" # unverified
resvg = "0.47.0"
# Terminal and window.
ratatui = "0.30.2"
crossterm = "0.29.0"
# Gives the terminal back on a terminate signal or Ctrl+Break (W1d-2's
# contract request 1); pure Rust.
ctrlc = { version = "3.5.2", features = ["termination"] }
accesskit = "0.25.1"
accesskit_winit = "0.34.1"
# Command line and logging.
clap = { version = "4.6.1", features = ["derive"] }
# Shell completion scripts for diro completions SHELL (plan section 5.19).
clap_complete = "4.6"
# The local time zone, so dates read in the owner's local time and never in
# UTC (W1e's contract request, resolved at the pair 2 integration): pure Rust,
# with the zone database bundled and the Windows zone read from the system.
jiff = "0.2"
tracing = "0.1.44"
# Tests.
insta = "1.48.0"
proptest = "1.11.0"
tempfile = "3.27.0"

[workspace.lints.rust]
missing_docs = "deny"
# Denied, not forbidden: the platform module of diroxide-vfs may allow it,
# and is reviewed at integration.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# No unwrap or expect in library code; tests may use them (clippy.toml).
unwrap_used = "warn"
expect_used = "warn"

# Build profiles (plan section 7): lean debug builds that share a cache.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
opt-level = 1
debug = false

# The regex engine at full speed in debug builds and tests (R17, R18): a
# pattern compiled at opt-level 1 runs several times slower.
[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

# Highlighting at full speed in debug builds and tests (R17): syntect's
# parser and its fancy-regex engine are the hot loop of the viewer.
[profile.dev.package.syntect]
opt-level = 3

[profile.dev.package.fancy-regex]
opt-level = 3

[profile.test]
debug = "line-tables-only"
incremental = false

[profile.release]
lto = false

# Packages for the owner and for releases.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
