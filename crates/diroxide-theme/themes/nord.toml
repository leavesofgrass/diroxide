# Nord: The Nord arctic palette.
#
# Ported from star's `nord` palette (star/themes.py).
# Error color: star's terminal error color (xterm 131, #af5f5f).
# star's colors, unchanged. Does not meet WCAG AA: 1 of 61 contrast checks fall short.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "nord"
display_name = "Nord"
kind = "dark"
description = "The Nord arctic palette."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"

[colors]
background = "#2e3440"
surface = "#3b4252"
text = "#eceff4"
dim_text = "#94a0b8"
heading1 = "#88c0d0"
heading2 = "#81a1c1"
heading3 = "#8fbcbb"
heading4 = "#a3be8c"
heading5 = "#a3be8c"
heading6 = "#a3be8c"
link = "#88c0d0"
code = "#ebcb8b"
code_background = "#3b4252"
quote = "#94a0b8"
error = "#af5f5f"

[styles.selection]
foreground = "#eceff4"
background = "#434c5e"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#2e3440"
background = "#88c0d0"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#eceff4"
background = "#434c5e"
attributes = ["underline"]

[styles.find_hit]
foreground = "#2e3440"
background = "#8fbcbb"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#2e3440"
background = "#81a1c1"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#a3be8c"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#ebcb8b"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#2e3440"
background = "#88c0d0"
attributes = ["bold"]

[styles.focus]
foreground = "#2e3440"
background = "#88c0d0"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#eceff4"
background = "#6d6530"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#eceff4"
background = "#306048"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#eceff4"
background = "#234c79"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#eceff4"
background = "#6d415d"
attributes = ["bold"]
