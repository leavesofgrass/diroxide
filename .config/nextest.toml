# nextest's configuration for the workspace. cargo nextest reads it from
# here on every run, native, in the container and on CI.
#
# The heavy group: the preview crate's tests that read five megabytes of
# Org, lists nested thousands deep on an eight mebibyte stack, and a
# hundred kilobytes of each carta format. These run one at a time, never
# beside each other, so memory pressure stays low wherever the run
# happens. Every other test keeps nextest's parallelism. The Markdown
# property test was in this group from Friday, October 23, 2026, when its
# read thread aborted twice on the Windows CI runner with
# STATUS_STACK_OVERFLOW and memory pressure was blamed; on Tuesday,
# November 3, 2026 the Linux runner overflowed on it too, a probe over
# 200,000 generated texts found one that overflowed any stack, and the
# cause was the document builder looping without end on a link opened
# while no row was open. The builder is fixed and the test left the group.
#
# The conformance group: the host's conformance suite run against the
# example plugins and the fake plugin, each run starting and stopping the
# plugin's process many times over, with Python among them. On the
# Windows CI runner (Monday, November 2, 2026) a Python plugin's start
# outran the manifest's ten-second startup timeout while other tests ran
# beside it. These runs go one at a time too.
[test-groups]
heavy = { max-threads = 1 }
conformance = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(diroxide-preview) & (test(five_megabyte) | test(nested_list) | test(three_thousand_deep) | test(hundred_kilobytes))'
test-group = 'heavy'

[[profile.default.overrides]]
filter = 'test(conformance)'
test-group = 'conformance'
