# The file types diroxide knows, and their groups: the shipped table,
# embedded in the program. The owner's own filetypes.toml has the same
# shape and is read after this one; a type or group with an id from here
# replaces it. Detection tests a file's first 64 bytes against `magic`
# (hexadecimal pairs, ?? for any byte), then `when` (one filter
# expression; `content` is the first bytes as text), then the name
# (`extensions`, `patterns`). A child (`parent`) always beats its parent;
# otherwise the higher `priority` wins. A signature of fewer than three
# fixed bytes counts only with the name or the condition as well.
#
# Groups are what Select by group and `group:` name; a type is in one
# group, and a group's `patterns` add files by their names alone.

[[group]]
id = "images"
name = "Images"
about = "Pictures and photos: PNG, JPEG, GIF, WebP, camera raw files and the like."

[[group]]
id = "music"
name = "Music"
about = "Sound and music: MP3, FLAC, Ogg, WAV and the like."

[[group]]
id = "video"
name = "Video"
about = "Video: MP4, Matroska, WebM, QuickTime and the like."

[[group]]
id = "documents"
name = "Documents"
about = "Documents, sheets, slides and e-books: PDF, Word, OpenDocument, EPUB."

[[group]]
id = "archives"
name = "Archives"
about = "Archives and disk images: zip, 7z, tar and its compressed forms, ISO."

[[group]]
id = "code"
name = "Code"
about = "Source code, scripts and settings files: Rust, C, Python, HTML, JSON, TOML."

[[group]]
id = "text"
name = "Text"
about = "Plain text, notes and logs: TXT, Markdown, CSV, INI and the like."

[[group]]
id = "screenshots"
name = "Screenshots"
about = "Screen pictures by their names: Windows, macOS, iOS, Android, GNOME and KDE."
patterns = [
    # Windows, Win and Print Screen.
    're:^Screenshot \(\d+\)\.png$',
    # macOS, older and newer, 12 or 24 hours; the space before AM or PM is a narrow no-break space on macOS 14 and later.
    're:^Screen ?shot \d{4}-\d{2}-\d{2} at \d{1,2}\.\d{2}\.\d{2}(?:\s?[AP]M)?(?: \(\d+\))?\.png$',
    # iOS, a weak sign: a PNG named like a camera file.
    're:^IMG_\d{4}\.PNG$',
    # Android, stock and Samsung.
    're:^Screenshot_\d{8}[-_]\d{6}(?:_[\w.]+)?\.(?:png|jpe?g)$',
    # GNOME.
    're:^Screenshot from \d{4}-\d{2}-\d{2} \d{2}-\d{2}-\d{2}\.png$',
    # KDE Spectacle.
    're:^Screenshot_\d{8}_\d{6}\.png$',
]

