# The helper programs (alpha 4; R28 1.4; the owner's answers 116 and 117).
# Each file is the publisher's own, at the publisher's own address, and
# this project hosts no copy (the owner's private mirror keeps old pins).
# A helper file has a url and no pack; its size and SHA-256 come from
# packaging/components/pins.toml, which cargo xtask components --pin ID
# writes on CI's runner (.github/workflows/pin.yml), never typed. A file
# not pinned yet is left out of the list with a line.
#
# Per component, beside the fields above: tools, the tools registry's ids
# of its programs, whose version line is said after install; notice, a
# sentence the ask-first question says; held, why it stays out of the
# list for now. Per file: keep, the members unpacked, as patterns on the
# path after strip (* within a name, ** for folders); rename, pairs of a
# member's path and its plain new path; also_exec, more programs;
# checksums, the publisher's checksums file where GitHub shows no digest;
# held, why the file stays out for now. Member names marked "to verify"
# in R28 are checked by the pin job's first run, which unpacks each file
# as the program does and fails when a program is missing.

