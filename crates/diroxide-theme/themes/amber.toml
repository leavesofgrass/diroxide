# Amber: Low-blue amber on near black, phosphor's warm cousin.
#
# Ported from star's `amber` palette (star/themes.py).
# Error color: star's terminal error color (xterm 203, #ff5f5f).
# star's colors, unchanged. Meets WCAG AA.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "amber"
display_name = "Amber"
kind = "dark"
description = "Low-blue amber on near black, phosphor's warm cousin."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"

[colors]
background = "#171204"
surface = "#241b08"
text = "#f0b458"
dim_text = "#b08448"
heading1 = "#ffcf70"
heading2 = "#f5a832"
heading3 = "#e0953a"
heading4 = "#d4b96a"
heading5 = "#d4b96a"
heading6 = "#d4b96a"
link = "#ffc04d"
code = "#ffd98a"
code_background = "#241b08"
quote = "#b08448"
error = "#ff5f5f"

[styles.selection]
foreground = "#f0b458"
background = "#3f3010"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#171204"
background = "#ffcf70"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#f0b458"
background = "#3f3010"
attributes = ["underline"]

[styles.find_hit]
foreground = "#171204"
background = "#e0953a"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#171204"
background = "#f5a832"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#d4b96a"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#ffd98a"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#171204"
background = "#ffcf70"
attributes = ["bold"]

[styles.focus]
foreground = "#171204"
background = "#ffc04d"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#f0b458"
background = "#5c4c05"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#f0b458"
background = "#20481e"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#f0b458"
background = "#13344f"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#f0b458"
background = "#5d2933"
attributes = ["bold"]
