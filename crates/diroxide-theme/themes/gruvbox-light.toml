# Gruvbox Light: Gruvbox's light half.
#
# Ported from star's `gruvbox-light` palette (star/themes.py).
# Error color: star's terminal error color (xterm 124, #af0000).
# star's colors, unchanged. Meets WCAG AA.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "gruvbox-light"
display_name = "Gruvbox Light"
kind = "light"
description = "Gruvbox's light half."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"
counterpart = "gruvbox-dark"

[colors]
background = "#fbf1c7"
surface = "#ebdbb2"
text = "#3c3836"
dim_text = "#665c54"
heading1 = "#8f5c0a"
heading2 = "#af3a03"
heading3 = "#38684a"
heading4 = "#076678"
heading5 = "#076678"
heading6 = "#076678"
link = "#076678"
code = "#635e0a"
code_background = "#ebdbb2"
quote = "#665c54"
error = "#af0000"

[styles.selection]
foreground = "#3c3836"
background = "#d5c4a1"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#fbf1c7"
background = "#8f5c0a"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#3c3836"
background = "#d5c4a1"
attributes = ["underline"]

[styles.find_hit]
foreground = "#fbf1c7"
background = "#38684a"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#fbf1c7"
background = "#af3a03"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#076678"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#635e0a"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#fbf1c7"
background = "#8f5c0a"
attributes = ["bold"]

[styles.focus]
foreground = "#fbf1c7"
background = "#076678"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#3c3836"
background = "#fce885"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#3c3836"
background = "#b5e2a1"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#3c3836"
background = "#a7cbdb"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#3c3836"
background = "#fcbeba"
attributes = ["bold"]
