# The menus of diroxide. This is the built-in menus.toml: copy it to
# menus.toml in the config folder and change it there to add, remove or
# reorder items and submenus. diroxide writes it beside your file as
# menus-defaults.toml; changes to that copy are not read.
#
# Each [[menu]] has an id, a title and an access key (Alt plus the key
# opens it from anywhere; F9 opens the menu bar). A menu with
# bar = false is a submenu, opened from an item with menu = "its id".
# Each [[menu.item]] runs a command by its id, the same ids keymap.toml
# and banks.toml use. The label is the command's name unless given. The
# access key is one letter, unique in its menu. when = "trash" shows the
# item only where the place has a trash; the other conditions are
# writable, no_trash, restore, links and attributes, and edits and
# removes, which are writable and trash that also hold inside a zip
# diroxide rewrites. Every item shows its
# key from the live keymap, so a menu never shows a key that is not bound.

