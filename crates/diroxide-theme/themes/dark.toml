# Dark: star's original dark theme.
#
# Ported from star's `dark` palette (star/themes.py).
# Error color: the color star's terminal table used for errors (#f07cd0).
# star's colors, unchanged. Does not meet WCAG AA: 1 of 61 contrast checks fall short.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "dark"
display_name = "Dark"
kind = "dark"
description = "star's original dark theme."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"
counterpart = "light"

[colors]
background = "#16181d"
surface = "#1e2128"
text = "#c6ccd4"
dim_text = "#5c6370"
heading1 = "#82aaff"
heading2 = "#89ddff"
heading3 = "#c792ea"
heading4 = "#f78c6c"
heading5 = "#f78c6c"
heading6 = "#f78c6c"
link = "#82aaff"
code = "#7fdbab"
code_background = "#1e2128"
quote = "#79818e"
error = "#f07cd0"

[styles.selection]
foreground = "#c6ccd4"
background = "#2c313a"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#16181d"
background = "#82aaff"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#c6ccd4"
background = "#2c313a"
attributes = ["underline"]

[styles.find_hit]
foreground = "#16181d"
background = "#c792ea"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#16181d"
background = "#89ddff"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#f78c6c"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#7fdbab"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#16181d"
background = "#82aaff"
attributes = ["bold"]

[styles.focus]
foreground = "#16181d"
background = "#82aaff"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#c6ccd4"
background = "#5c5117"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#c6ccd4"
background = "#1f4d2f"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#c6ccd4"
background = "#123861"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#c6ccd4"
background = "#5c2d45"
attributes = ["bold"]
