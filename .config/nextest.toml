# nextest's configuration for the workspace. cargo nextest reads it from
# here on every run, native, in the container and on CI.
#
# The heavy group: the preview crate's tests that read five megabytes of
# Org, lists nested thousands deep on an eight mebibyte stack, and a
# hundred kilobytes of each carta format. These run one at a time, never
# beside each other, so memory pressure stays low wherever the run
# happens. Every other test keeps nextest's parallelism. The Markdown
# property test was in this group from Friday, October 23, 2026, when its
# read thread aborted twice on the Windows CI runner with
# STATUS_STACK_OVERFLOW and memory pressure was blamed; on Tuesday,
# November 3, 2026 the Linux runner overflowed on it too, a probe over
# 200,000 generated texts found one that overflowed any stack, and the
# cause was the document builder looping without end on a link opened
# while no row was open. The builder is fixed and the test left the group.
#
# The conformance group: the host's conformance suite run against the
# example plugins and the fake plugin, each run starting and stopping the
# plugin's process many times over, with Python among them. On the
# Windows CI runner (Monday, November 2, 2026) a Python plugin's start
# outran the manifest's ten-second startup timeout while other tests ran
# beside it. These runs go one at a time too.
[test-groups]
heavy = { max-threads = 1 }
conformance = { max-threads = 1 }

# A test that is still running after ten minutes is stopped and fails, so
# a hang never blocks a check: on Friday, November 6, 2026 the GUI's
# interrupted-job test sat for 78 minutes in a merge check on a loaded
# machine (it passes alone in a tenth of a second), and the check had to
# be killed by hand. nextest reports a test as slow after each period;
# the tenth report ends it. The slow tests below finish well inside this.
[profile.default]
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
filter = 'package(diroxide-preview) & (test(five_megabyte) | test(nested_list) | test(three_thousand_deep) | test(hundred_kilobytes))'
test-group = 'heavy'

[[profile.default.overrides]]
filter = 'test(conformance)'
test-group = 'conformance'

# The slow tests (docs/dev/building.md, "Slow tests"): the tests that took
# ten seconds or more in the full run, natively or in the container, as
# timed on Tuesday, November 3, 2026. Each runs only when DIRO_SLOW is 1,
# which CI's jobs and scripts/dev-check.sh set. A quick run leaves it
# unset: each of these then passes at once and writes "skipped: slow, set
# DIRO_SLOW=1", and this override shows that line as the test ends. A new
# slow test calls its crate's slow_test_skipped() first and is named here;
# xtask's slow::tests check both ways. The SFTP plugin's server tests are
# gated the same way in their own workspace.
[[profile.default.overrides]]
filter = '''
test(=demo::tests::the_demo_set_holds_every_file_part_six_names)
| test(=bench::tests::a_quick_run_of_every_scenario_works_and_cleans_up)
| test(=spike_listing::the_provider_lists_the_root_and_a_deep_folder)
| test(=script::examples::the_python_examples_pass_their_own_tests)
| test(=script::examples::total_size_reports_progress_on_a_long_list)
| test(=script::skeleton::tests::the_python_skeletons_pass_their_own_tests_and_the_conformance_suite)
| test(=carta_paths::five_megabytes_of_org_for_the_record)
'''
success-output = 'immediate'
