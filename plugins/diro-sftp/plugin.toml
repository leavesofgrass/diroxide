# The SFTP places plugin (R24, "The plugin's shape"; answers 78 to 95).
# One program in two modes: the plugin the host starts, and the askpass
# helper ssh starts with DIRO_ASKPASS_ENDPOINT set (answer 82).
#
# The provider's methods: connect, list, stat, ranged reads, the write
# session, the operations, server-side copy and volumes (S-B, R25 commits
# 57 to 64); places, the Sites list and the site commands (S-C, commits
# 72 to 75). No trash (answer 86) and no watch: SFTP has neither.

[plugin]
id = "sftp"
name = "SFTP places"
version = "0.1.0-alpha.1"
description = "Opens sftp places through the OpenSSH client on this computer."
license = "Apache-2.0 OR MIT"
homepage = "https://diroxide.app"
protocol = 1
min_host = "0.1.0-alpha.1"

[run]
command = ["./diro-sftp"]
start = "on_demand"
concurrency = 16
# A login lives in the plugin's memory, so it is never stopped for idling.
idle_timeout = "never"

[run.windows]
command = ["./diro-sftp.exe"]

[permissions]
fs = "none"
# Connect opens a site's start folder in the active panel and its local
# folder in the other (R24 section 3.2); nothing else moves a panel.
panel = "write"

[permissions.declared]
network = "connects to the servers you open, through ssh"
files = "its own state folder; ssh reads your config and keys"
programs = "ssh, found by the rules in its settings"

[[provider]]
scheme = "sftp"
name = "SFTP"
separator = "/"
case_sensitive = true
writable = true
links = true
attributes = true
# Both asked per connection: provider/connect answers whether this server
# renames over a file (posix-rename) and copies on its own (copy-data);
# copy_hint says stream, and a replacing rename is refused in words, on a
# server that cannot.
atomic_rename = true
server_side_copy = true
methods = [
    "connect", "list", "stat", "read", "write_begin", "write_chunk", "write_end",
    "create_dir", "rename", "remove", "set_attributes", "copy_hint", "copy", "volumes",
    "places",
]
lease = "listers"

[[setting]]
key = "ssh_program"
type = "path"
default = ""
description = "The ssh program to use. Empty finds the newest one on this computer."

[[setting]]
key = "ssh_config_file"
type = "path"
default = ""
description = "An ssh configuration file to use instead of your own. Empty uses yours."

[[setting]]
key = "connect_timeout"
type = "int"
default = 20
description = "Seconds to wait for a server, when your ssh configuration sets none."

[[setting]]
key = "keepalive_seconds"
type = "int"
default = 15
description = "Seconds between keepalives, when your ssh configuration sets none."

[[setting]]
key = "requests"
type = "int"
default = 64
description = "SFTP requests in flight for one transfer."

[[setting]]
key = "chunk_kib"
type = "int"
default = 32
description = "Kilobytes in one SFTP request, at most 128."

[[setting]]
key = "sessions"
type = "int"
default = 2
description = "Sessions one server may get. Two let a listing run beside a copy."

[[setting]]
key = "ssh_debug_log"
type = "bool"
default = false
description = "Write ssh's debug log to this plugin's state folder. Off by default."

# The commands (R24, "The plugin's shape"; R25 commits 73 to 75). Run
# from the Sites list, a command acts on its row; run from a panel that
# shows an sftp place, on that place's connection.

[[command]]
id = "sites"
name = "SFTP sites"
description = "Lists your saved sites and the hosts of your ssh config."
selection = "none"

[[command]]
id = "connect"
name = "Connect to the site"
description = "Connects and opens the site's start folders."

[[command]]
id = "disconnect"
name = "Disconnect from the site"
description = "Closes the site's connection quietly."

[[command]]
id = "cancel_connection"
name = "Cancel the site's connection"
description = "Ends ssh at once, even in the middle of a transfer."

[[command]]
id = "new_site"
name = "New SFTP site"
description = "Saves a new site; on a host from your ssh config, saves it."

[[command]]
id = "edit_site"
name = "Edit the site"
description = "Changes the site's name, address, group, folder or secret mode."

[[command]]
id = "delete_site"
name = "Delete the site"
description = "Deletes the saved site after asking; starts on No."

[[command]]
id = "forget_password"
name = "Forget the site's password"
description = "Removes its saved password from memory and the keyring."

# The Sites list: Enter connects; the actions by key.
[[lister]]
id = "sites"
name = "SFTP sites"
activate = "connect"

[[lister.columns]]
id = "state"
header = "State"
kind = "text"
sorts = true

[[lister.columns]]
id = "address"
header = "Address"
kind = "text"
sorts = true

[[lister.columns]]
id = "group"
header = "Group"
kind = "text"
sorts = true

[[lister.action]]
key = "alt+n"
command = "new_site"
selection = "none"

[[lister.action]]
key = "alt+e"
command = "edit_site"
selection = "one"

[[lister.action]]
key = "alt+d"
command = "delete_site"
selection = "one"

[[lister.action]]
key = "alt+x"
command = "disconnect"
selection = "one"

[[lister.action]]
key = "alt+c"
command = "cancel_connection"
selection = "one"

[[lister.action]]
key = "alt+f"
command = "forget_password"
selection = "one"
