# Gruvbox Dark: Retro warm dark palette.
#
# Ported from star's `gruvbox-dark` palette (star/themes.py).
# Error color: star's terminal error color (xterm 203, #ff5f5f).
# star's colors, unchanged. Meets WCAG AA.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "gruvbox-dark"
display_name = "Gruvbox Dark"
kind = "dark"
description = "Retro warm dark palette."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"
counterpart = "gruvbox-light"

[colors]
background = "#282828"
surface = "#3c3836"
text = "#ebdbb2"
dim_text = "#a89984"
heading1 = "#fabd2f"
heading2 = "#fe8019"
heading3 = "#8ec07c"
heading4 = "#83a598"
heading5 = "#83a598"
heading6 = "#83a598"
link = "#83a598"
code = "#b8bb26"
code_background = "#3c3836"
quote = "#a89984"
error = "#ff5f5f"

[styles.selection]
foreground = "#ebdbb2"
background = "#504945"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#282828"
background = "#fabd2f"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#ebdbb2"
background = "#504945"
attributes = ["underline"]

[styles.find_hit]
foreground = "#282828"
background = "#8ec07c"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#282828"
background = "#fe8019"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#83a598"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#b8bb26"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#282828"
background = "#fabd2f"
attributes = ["bold"]

[styles.focus]
foreground = "#282828"
background = "#83a598"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#ebdbb2"
background = "#695c1f"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#ebdbb2"
background = "#2c5837"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#ebdbb2"
background = "#1f4469"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#ebdbb2"
background = "#69394d"
attributes = ["bold"]
