# Rose Pine: Muted rose and pine palette.
#
# Ported from star's `rose-pine` palette (star/themes.py).
# Error color: star's terminal error color (xterm 211, #ff87af).
# star's colors, unchanged. Meets WCAG AA.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "rose-pine"
display_name = "Rose Pine"
kind = "dark"
description = "Muted rose and pine palette."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"

[colors]
background = "#191724"
surface = "#26233a"
text = "#e0def4"
dim_text = "#908caa"
heading1 = "#ebbcba"
heading2 = "#9ccfd8"
heading3 = "#c4a7e7"
heading4 = "#f6c177"
heading5 = "#f6c177"
heading6 = "#f6c177"
link = "#9ccfd8"
code = "#f6c177"
code_background = "#26233a"
quote = "#908caa"
error = "#ff87af"

[styles.selection]
foreground = "#e0def4"
background = "#403d52"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#191724"
background = "#ebbcba"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#e0def4"
background = "#403d52"
attributes = ["underline"]

[styles.find_hit]
foreground = "#191724"
background = "#c4a7e7"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#191724"
background = "#9ccfd8"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#f6c177"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#f6c177"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#191724"
background = "#ebbcba"
attributes = ["bold"]

[styles.focus]
foreground = "#191724"
background = "#9ccfd8"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#e0def4"
background = "#5e501c"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#e0def4"
background = "#214c34"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#e0def4"
background = "#153866"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#e0def4"
background = "#5e2d4a"
attributes = ["bold"]
