# Keys kept free now for the commands of later alphas (plan section 5.7
# and the Wave 1 amendments), so no alpha.1 binding takes a key the plan
# has already promised. The keymap's tests read it: a default binding
# uses a reserved key only for the command it is reserved for.
#
# column = "both", "terminal" or "window".


[[key]]
keys = ["ctrl+t"]
command = "tab.new"
name = "New tab"
alpha = "alpha.8"
column = "both"

[[key]]
keys = ["ctrl+w"]
command = "tab.close"
name = "Close tab"
alpha = "alpha.8"
column = "both"

[[key]]
keys = ["ctrl+tab"]
command = "tab.next"
name = "Next tab"
alpha = "alpha.8"
column = "window"

[[key]]
keys = ["ctrl+shift+tab"]
command = "tab.previous"
name = "Previous tab"
alpha = "alpha.8"
column = "window"

[[key]]
keys = ["ctrl+shift+e"]
command = "view.tree"
name = "Folder tree"
alpha = "alpha.8"
column = "window"

[[key]]
keys = ["f11"]
command = "view.full-screen"
name = "Full screen"
alpha = "alpha.6"
column = "window"
