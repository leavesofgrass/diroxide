# The bench's sizes and starting budgets, read by cargo xtask bench
# (docs/dev/bench.md). Its trees are written under the target folder and
# removed after the run; only this file, search-tree.toml,
# search-spike.toml and baseline.json are ever committed.

# Each scenario runs this many times; the median is reported.
runs = 3
# The ratchet's band: a median further than this from the baseline is
# said, and fails the run under --gate (from Wave 2, once two baselines
# exist).
tolerance_percent = 20

# R8's starting budgets (research/file-operations.md, "Large
# directories"): a warm listing of 100,000 entries in 300 ms on Linux and
# macOS and 800 ms on Windows. The stat scenario starts from the same
# numbers. Report-only in Wave 1.
[budgets_ms]
list_windows = 800
list_other = 300
stat_windows = 800
stat_other = 300
# The search scenarios (alpha.3, W3s): the plan's starting budgets for a
# warm search of the 1 GB tree (research/alpha3-plan.md, "Search speed on
# a 1 GB tree"): names in 0.6 seconds and contents in 1.5 seconds on
# Linux, two and a half times those on Windows, through the search
# engine. Report-only until a baseline is saved.
search_name_windows = 1500
search_name_other = 600
search_content_windows = 3750
search_content_other = 1500

# The full run.
[full]
list_entries = 100000
copy_bytes = 1000000000
# The slow-place scenario (R23): a copy from a fake provider whose every
# call waits and one call stalls, long enough for the stall to be said.
# The stalled call is counted from the start of the run, after the plan.
slow_files = 40
slow_file_bytes = 65536
slow_per_call_ms = 2
slow_stall_after_calls = 80
slow_stall_ms = 400
stall_after_ms = 150
# The archive scenarios (alpha.2, W2g): a zip, a tar and a 7z of this many
# empty members listed through diro archive list; a zip of one file of
# unpack_bytes unpacked through diro archive unpack; the viewer's first
# screen of a text log of viewer_bytes.
archive_entries = 100000
unpack_bytes = 200000000
viewer_bytes = 256000000

# The quick run (--quick), for tests and a first look: the same scenarios
# on small trees.
[quick]
list_entries = 2000
copy_bytes = 8000000
slow_files = 8
slow_file_bytes = 4096
slow_per_call_ms = 1
slow_stall_after_calls = 20
slow_stall_ms = 300
stall_after_ms = 100
archive_entries = 2000
unpack_bytes = 4000000
viewer_bytes = 2000000
