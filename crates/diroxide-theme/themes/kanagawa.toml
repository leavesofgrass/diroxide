# Kanagawa: Palette after Hokusai's wave.
#
# Ported from star's `kanagawa` palette (star/themes.py).
# Error color: star's terminal error color (xterm 210, #ff8787).
# star's colors, unchanged. Meets WCAG AA.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "kanagawa"
display_name = "Kanagawa"
kind = "dark"
description = "Palette after Hokusai's wave."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"

[colors]
background = "#1f1f28"
surface = "#16161d"
text = "#dcd7ba"
dim_text = "#9c9a90"
heading1 = "#7e9cd8"
heading2 = "#98bb6c"
heading3 = "#7aa89f"
heading4 = "#e6c384"
heading5 = "#e6c384"
heading6 = "#e6c384"
link = "#7fb4ca"
code = "#ffa066"
code_background = "#16161d"
quote = "#9c9a90"
error = "#ff8787"

[styles.selection]
foreground = "#dcd7ba"
background = "#2d4f67"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#1f1f28"
background = "#7e9cd8"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#dcd7ba"
background = "#2d4f67"
attributes = ["underline"]

[styles.find_hit]
foreground = "#1f1f28"
background = "#7aa89f"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#1f1f28"
background = "#98bb6c"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#e6c384"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#ffa066"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#1f1f28"
background = "#7e9cd8"
attributes = ["bold"]

[styles.focus]
foreground = "#1f1f28"
background = "#7fb4ca"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#dcd7ba"
background = "#62561f"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#dcd7ba"
background = "#255137"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#dcd7ba"
background = "#193d69"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#dcd7ba"
background = "#62324d"
attributes = ["bold"]
