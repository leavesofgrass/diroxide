# One Light: The One Light editor palette.
#
# Ported from star's `one-light` palette (star/themes.py).
# Error color: the scheme's red (#e45649); star had no error color.
# star's colors, unchanged. Does not meet WCAG AA: 8 of 61 contrast checks fall short.
#
# Generated by `cargo run -p diroxide-theme --example generate_builtin_themes`,
# from textweaver's theme crate, relicensed by its author (Apache-2.0 OR MIT).
# To make your own theme, copy this file into your themes folder under a new
# name and change theme.name; see docs/themes.md.

[theme]
name = "one-light"
display_name = "One Light"
kind = "light"
description = "The One Light editor palette."
author = "star palettes (star/themes.py); ported to textweaver"
origin = "star"
counterpart = "one-dark"

[colors]
background = "#fafafa"
surface = "#eaeaeb"
text = "#383a42"
dim_text = "#a0a1a7"
heading1 = "#4078f2"
heading2 = "#a626a4"
heading3 = "#0184bc"
heading4 = "#50a14f"
heading5 = "#318332"
heading6 = "#318332"
link = "#4078f2"
code = "#c18401"
code_background = "#eaeaeb"
quote = "#727379"
error = "#e45649"

[styles.selection]
foreground = "#383a42"
background = "#dbdbdc"
attributes = ["reverse"]

[styles.spoken_word]
foreground = "#fafafa"
background = "#356ce5"
attributes = ["bold"]

[styles.spoken_sentence]
foreground = "#383a42"
background = "#dbdbdc"
attributes = ["underline"]

[styles.find_hit]
foreground = "#fafafa"
background = "#007ab2"
attributes = ["underline"]

[styles.current_find_hit]
foreground = "#fafafa"
background = "#a626a4"
attributes = ["bold", "underline"]

[styles.bookmark]
foreground = "#318332"
background = "none"
attributes = ["bold", "underline"]

[styles.note]
foreground = "#a16600"
background = "none"
attributes = ["italic", "underline"]

[styles.status_bar]
foreground = "#fafafa"
background = "#356ce5"
attributes = ["bold"]

[styles.focus]
foreground = "#fafafa"
background = "#356ce5"
attributes = ["bold"]

[[user_highlights]]
name = "yellow"
foreground = "#383a42"
background = "#fceda6"
attributes = ["bold"]

[[user_highlights]]
name = "green"
foreground = "#383a42"
background = "#b5e8c2"
attributes = ["bold"]

[[user_highlights]]
name = "blue"
foreground = "#383a42"
background = "#a6d1fc"
attributes = ["bold"]

[[user_highlights]]
name = "pink"
foreground = "#383a42"
background = "#fcc4db"
attributes = ["bold"]
