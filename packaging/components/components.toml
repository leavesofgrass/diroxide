# 7-Zip 26.05 (GitHub release assets, where 7-zip.org links). It reads
# RAR through code under the unRAR restriction, so its ask line carries
# the unRAR sentence; diroxide reads RAR and never writes it. Spike T2:
# the pure-Rust reader opens extra.7z whole, and T1 found every member
# plain. The Windows files are held: extra.7z's 7za reads no RAR, ISO or
# disk image (K's finding), and the full 7-Zip for Windows is inside the
# installer, which the unpack does not open; the owner decides.
[[component]]
id = "7zip"
title = "7-Zip"
kind = "helper"
version = "26.05"
license = "LGPL-2.1-or-later AND BSD-3-Clause"
credit = "Igor Pavlov"
features = ["rar"]
tools = ["7z"]
notice = "unRAR terms: diroxide never writes RAR."
action = "unpack"

[[component.file]]
name = "7z2605-extra.7z"
target = "x86_64-pc-windows-msvc"
url = "https://github.com/ip7z/7zip/releases/download/26.05/7z2605-extra.7z"
keep = ["x64/7za.exe", "License.txt"]
exec = "x64/7za.exe"
held = "its 7za reads no RAR, ISO or disk image; the owner decides"

[[component.file]]
name = "7z2605-extra.7z"
target = "aarch64-pc-windows-msvc"
url = "https://github.com/ip7z/7zip/releases/download/26.05/7z2605-extra.7z"
keep = ["arm64/7za.exe", "License.txt"]
exec = "arm64/7za.exe"
held = "its 7za reads no RAR, ISO or disk image; the owner decides"

[[component.file]]
name = "7z2605-linux-x64.tar.xz"
target = "x86_64-unknown-linux-gnu"
url = "https://github.com/ip7z/7zip/releases/download/26.05/7z2605-linux-x64.tar.xz"
keep = ["7zz", "License.txt"]
exec = "7zz"

[[component.file]]
name = "7z2605-linux-arm64.tar.xz"
target = "aarch64-unknown-linux-gnu"
url = "https://github.com/ip7z/7zip/releases/download/26.05/7z2605-linux-arm64.tar.xz"
